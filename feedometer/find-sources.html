<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Browse Sources — FeedOmeter</title>
  <script>
    (function(){
      try {
        if (window.self !== window.top) document.documentElement.classList.add('rv-in-frame');
        var s = localStorage.getItem('rv_colour_scheme') || 'vanilla';
        var valid = ['vanilla','slate','moss','peach','sand','bw'];
        if (valid.indexOf(s) === -1) s = 'vanilla';
        if (s !== 'vanilla') document.documentElement.setAttribute('data-scheme', s);
        var t = localStorage.getItem('aggregator-theme');
        if (t === 'dark') document.documentElement.setAttribute('data-theme','dark');
      } catch(e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/tokens.css"/>
  <link rel="stylesheet" href="styles/rover-shell.css"/>
  <link rel="stylesheet" href="styles/follow-folder-modal.css"/>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bs-bg: var(--paper, #ffffff);
      --bs-card-bg: var(--paper, #ffffff);
      --bs-card-hover: var(--paper-2, #f8fafc);
      --bs-border: var(--line, #e2e8f0);
      --bs-border-hover: var(--line-2, #cbd5e1);
      --bs-ink: var(--ink, #0f172a);
      --bs-ink-2: var(--ink-2, #334155);
      --bs-muted: var(--muted, #64748b);
      --bs-accent: var(--accent, #ea580c);
      --bs-green: #00BF63;
      --bs-green-bg: #dcfce7;
      --bs-green-text: #00BF63;
      --bs-dropdown-bg: #ffffff;
    }

    [data-theme="dark"] {
      --bs-bg: #0f172a;
      --bs-card-bg: #1e293b;
      --bs-card-hover: #334155;
      --bs-border: rgba(226, 232, 240, 0.12);
      --bs-border-hover: rgba(226, 232, 240, 0.25);
      --bs-ink: #f8fafc;
      --bs-ink-2: #cbd5e1;
      --bs-muted: #94a3b8;
      --bs-green: #00BF63;
      --bs-green-bg: rgba(34, 197, 94, 0.15);
      --bs-green-text: #00BF63;
      --bs-dropdown-bg: #1e293b;
    }

    html, body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bs-bg);
      color: var(--bs-ink);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    html.rv-in-frame,
    html.rv-in-frame body {
      background: transparent !important;
    }

    /* ── Main Container ── */
    .bs-wrap {
      max-width: 1080px;
      margin: 0 auto;
      padding: 24px clamp(16px, 3.5vw, 32px) 60px;
    }

    /* ── Top Tabs Bar (Websites, Reddit, Newsletters, Google News) ── */
    .bs-tabs {
      display: flex;
      align-items: center;
      gap: 28px;
      border-bottom: 1px solid var(--bs-border);
      padding-bottom: 8px;
      margin-bottom: 20px;
      overflow-x: auto;
    }

    .bs-tab {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: transparent;
      border: 0;
      padding: 6px 2px 10px;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--bs-muted);
      cursor: pointer;
      position: relative;
      transition: color 0.15s ease;
      white-space: nowrap;
    }
    .bs-tab:hover {
      color: var(--bs-ink);
    }
    .bs-tab.active {
      color: var(--bs-ink);
      font-weight: 750;
    }
    .bs-tab.active::after {
      content: "";
      position: absolute;
      bottom: -9px;
      left: 0;
      right: 0;
      height: 2.5px;
      background: var(--bs-ink);
      border-radius: 2px;
    }

    /* ── Search Container with Floating Context Autocomplete ── */
    .bs-search-wrap {
      position: relative;
      margin-bottom: 28px;
      z-index: 200;
    }

    .bs-search-row {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bs-card-bg);
      border: 1.5px solid var(--bs-border);
      border-radius: 14px;
      padding: 6px 14px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
      transition: all 0.2s ease;
    }
    .bs-search-row.focused,
    .bs-search-row:focus-within {
      border-color: var(--bs-green, #00BF63);
      box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.12);
    }

    .bs-search-icon {
      color: #ef4444;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    .bs-search-icon svg {
      color: #ef4444;
      stroke: #ef4444;
    }

    .bs-search-input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      font-size: 14.5px;
      font-weight: 500;
      color: var(--bs-ink);
      padding: 6px 0;
    }
    .bs-search-input::placeholder {
      color: var(--bs-muted);
      font-weight: 400;
    }

    .bs-search-clear {
      background: var(--paper-2, #f1f5f9);
      border: 0;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      color: var(--bs-muted);
      font-size: 13px;
      cursor: pointer;
      display: none;
      place-items: center;
    }
    .bs-search-clear.visible {
      display: grid;
    }

    .bs-lang-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
      border-left: 1px solid var(--bs-border);
      padding-left: 4px;
    }

    .bs-lang-select {
      background: transparent;
      border: none;
      outline: none;
      font-size: 13px;
      font-weight: 600;
      color: var(--bs-muted);
      cursor: pointer;
      padding: 4px 22px 4px 6px;
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
    }
    [data-theme="dark"] .bs-lang-select {
      color: var(--bs-ink-2);
    }

    .bs-lang-chevron {
      position: absolute;
      right: 4px;
      pointer-events: none;
      color: #00BF63;
      stroke: #00BF63;
      flex-shrink: 0;
    }
    [data-theme="dark"] .bs-lang-chevron {
      color: #00BF63;
      stroke: #00BF63;
    }

    /* ── Floating Context Autocomplete Dropdown ── */
    .bs-dropdown {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      background: var(--bs-dropdown-bg);
      border: 1px solid var(--bs-border);
      border-radius: 14px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.12), 0 4px 12px rgba(0,0,0,0.06);
      max-height: 420px;
      overflow-y: auto;
      z-index: 1000;
      padding: 8px 0;
      display: none;
    }
    .bs-dropdown.open {
      display: block;
    }

    .bs-dd-section-title {
      font-size: 10px;
      font-weight: 800;
      color: var(--bs-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 8px 16px 4px;
    }

    .bs-dd-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 9px 16px;
      cursor: pointer;
      transition: background 0.12s ease;
      text-decoration: none;
      color: inherit;
    }
    .bs-dd-item:hover,
    .bs-dd-item.selected {
      background: var(--bs-card-hover);
    }

    .bs-dd-icon {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: #0f172a;
      color: #ffffff;
      display: grid;
      place-items: center;
      font-size: 10.5px;
      font-weight: 800;
      flex-shrink: 0;
      overflow: hidden;
    }

    .bs-dd-topic-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--paper-2, #f8fafc);
      border: 1px solid var(--bs-border);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--bs-ink);
    }
    .bs-dd-item:hover .bs-dd-topic-pill,
    .bs-dd-item.selected .bs-dd-topic-pill {
      border-color: var(--bs-ink);
      background: var(--bs-ink);
      color: #ffffff;
    }

    .bs-dd-text-group {
      display: flex;
      flex-direction: column;
      line-height: 1.25;
      overflow: hidden;
    }
    .bs-dd-main-text {
      font-size: 13.5px;
      font-weight: 650;
      color: var(--bs-ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .bs-dd-sub-text {
      font-size: 11px;
      color: var(--bs-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── EXPLORE MODE (Empty search state) ── */
    #bs-explore-view {
      display: block;
    }

    /* Hero Topic Visual Cards (Tech, Cyber, Marketing, Business) */
    .bs-hero-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 34px;
    }

    .bs-hero-card {
      height: 190px;
      border-radius: 16px;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      padding: 16px;
      color: #ffffff;
      text-decoration: none;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease;
      background-size: cover;
      background-position: center;
    }
    .bs-hero-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.16);
    }
    .bs-hero-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      z-index: 1;
    }

    .bs-hero-title {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.01em;
      position: relative;
      z-index: 2;
      text-align: center;
    }

    /* Section Headers */
    .bs-section-title {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.015em;
      color: var(--bs-ink);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Industry Grid (Cards) */
    .bs-industry-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 34px;
    }

    .bs-ind-card {
      background: var(--bs-card-bg);
      border: 1px solid var(--bs-border);
      border-radius: 14px;
      padding: 14px 16px;
      cursor: pointer;
      transition: all 0.18s ease;
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-decoration: none;
      color: inherit;
    }
    .bs-ind-card:hover {
      border-color: var(--bs-border-hover);
      background: var(--bs-card-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.05);
    }

    .bs-ind-name {
      font-size: 13.5px;
      font-weight: 750;
      color: var(--bs-ink);
    }

    .bs-ind-feature {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .bs-ind-logo {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      background: #0f172a;
      color: #ffffff;
      display: grid;
      place-items: center;
      font-size: 10.5px;
      font-weight: 800;
      flex-shrink: 0;
      overflow: hidden;
    }

    .bs-ind-meta {
      display: flex;
      flex-direction: column;
      line-height: 1.25;
      overflow: hidden;
    }
    .bs-ind-feat-label {
      font-size: 10px;
      color: var(--bs-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .bs-ind-publisher {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--bs-ink-2);
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
    }

    /* ── RESULTS MODE (Dual Column: Feeds Left, Related Topics Right) ── */
    #bs-results-view {
      display: none;
    }

    .bs-results-layout {
      display: grid;
      grid-template-columns: 1fr 280px;
      gap: 28px;
      align-items: flex-start;
    }

    /* Sorting & Control Bar */
    .bs-sort-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 8px;
    }
    .bs-sort-select {
      background: transparent;
      border: none;
      outline: none;
      font-size: 13px;
      font-weight: 600;
      color: var(--bs-muted);
      cursor: pointer;
    }
    .bs-sort-select:hover {
      color: var(--bs-ink);
    }

    /* Feed Results List */
    .bs-feed-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Individual Feed Card */
    .bs-feed-card {
      background: var(--bs-card-bg);
      border: 1px solid var(--bs-border);
      border-radius: 16px;
      padding: 20px 22px;
      transition: all 0.18s ease;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .bs-feed-card:hover {
      border-color: var(--bs-border-hover);
      box-shadow: 0 6px 20px rgba(15, 23, 42, 0.05);
    }

    .bs-fc-header {
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }

    .bs-fc-logo {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: #0f172a;
      color: #ffffff;
      display: grid;
      place-items: center;
      font-size: 16px;
      font-weight: 800;
      flex-shrink: 0;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .bs-fc-logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .bs-fc-title-group {
      flex: 1;
      min-width: 0;
    }

    .bs-fc-title {
      font-size: 15.5px;
      font-weight: 800;
      letter-spacing: -0.01em;
      color: var(--bs-ink);
      line-height: 1.25;
      margin-bottom: 3px;
    }

    .bs-fc-subinfo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--bs-muted);
    }
    .bs-fc-domain {
      color: var(--bs-muted);
      text-decoration: none;
    }
    .bs-fc-domain:hover {
      text-decoration: underline;
    }

    .bs-fc-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .bs-similar-btn {
      background: transparent;
      border: 0;
      font-size: 12px;
      font-weight: 600;
      color: var(--bs-muted);
      cursor: pointer;
      padding: 6px 8px;
      border-radius: 8px;
      transition: all 0.15s ease;
    }
    .bs-similar-btn:hover {
      background: var(--paper-2, #f1f5f9);
      color: var(--bs-ink);
    }

    .bs-follow-btn {
      padding: 6px 14px;
      border-radius: 8px;
      border: 1.5px solid var(--bs-green);
      background: transparent;
      color: var(--bs-green);
      font-size: 12.5px;
      font-weight: 750;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .bs-follow-btn:hover {
      background: var(--bs-green-bg);
    }
    .bs-follow-btn.following {
      background: var(--bs-green);
      color: #ffffff;
      border-color: var(--bs-green);
    }
    .bs-follow-btn.following:hover {
      background: #dc2626;
      border-color: #dc2626;
    }
    .bs-follow-btn.following:hover::after {
      content: "Unfollow";
    }
    .bs-follow-btn.following:hover span {
      display: none;
    }

    .bs-fc-desc {
      font-size: 13px;
      line-height: 1.5;
      color: var(--bs-ink-2);
    }

    .bs-fc-articles {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding-left: 2px;
    }
    .bs-fc-article-item {
      font-size: 12px;
      color: var(--bs-muted);
      position: relative;
      padding-left: 14px;
      line-height: 1.4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .bs-fc-article-item::before {
      content: "•";
      position: absolute;
      left: 2px;
      top: 0;
      color: var(--bs-muted);
      font-size: 14px;
    }

    .bs-fc-metrics {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 11.5px;
      color: var(--bs-muted);
      font-weight: 600;
      border-top: 1px solid var(--bs-border);
      padding-top: 10px;
      margin-top: 2px;
    }

    .bs-relevance-bar {
      width: 48px;
      height: 4px;
      border-radius: 4px;
      background: var(--bs-border);
      position: relative;
      overflow: hidden;
      display: inline-block;
      vertical-align: middle;
      margin: 0 4px;
    }
    .bs-relevance-fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      background: #475569;
      border-radius: 4px;
    }

    /* ── Right Column: Related Topics Panel ── */
    .bs-related-panel {
      position: sticky;
      top: 20px;
      background: var(--bs-card-bg);
      border: 1px solid var(--bs-border);
      border-radius: 16px;
      padding: 18px 18px 20px;
    }

    .bs-rp-title {
      font-size: 13.5px;
      font-weight: 800;
      color: var(--bs-ink);
      margin-bottom: 14px;
      letter-spacing: -0.01em;
    }

    .bs-rp-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .bs-tag-pill {
      background: var(--paper-2, #f8fafc);
      border: 1px solid var(--bs-border);
      color: var(--bs-ink-2);
      font-size: 12px;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      user-select: none;
    }
    .bs-tag-pill:hover {
      border-color: var(--bs-ink);
      background: var(--bs-ink);
      color: #ffffff;
      transform: translateY(-1px);
    }
    .bs-tag-pill .hash {
      color: var(--bs-muted);
      font-weight: 400;
    }
    .bs-tag-pill:hover .hash {
      color: rgba(255, 255, 255, 0.7);
    }

    /* Notification toast */
    .bs-toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #0f172a;
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: 8px;
      animation: bsFadeIn 0.2s ease;
    }
    @keyframes bsFadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* ── Side Drawer Popup on Card Click ── */
    .bs-drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(2px);
      z-index: 9000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.25s ease;
    }
    .bs-drawer-backdrop.open {
      opacity: 1;
      visibility: visible;
    }

    .bs-drawer {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: min(520px, 92vw);
      background: var(--bs-card-bg);
      border-left: 1px solid var(--bs-border);
      box-shadow: none;
      z-index: 9001;
      transform: translateX(100%);
      visibility: hidden;
      pointer-events: none;
      transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.28s;
      display: flex;
      flex-direction: column;
    }
    .bs-drawer.open {
      transform: translateX(0);
      visibility: visible;
      pointer-events: auto;
      box-shadow: -10px 0 35px rgba(0,0,0,0.18);
    }

    .bs-drawer-header {
      padding: 20px 24px 16px;
      border-bottom: 1px solid var(--bs-border);
      display: flex;
      align-items: flex-start;
      gap: 16px;
      position: relative;
    }
    .bs-drawer-close {
      position: absolute;
      top: 16px;
      right: 16px;
      background: transparent;
      border: 0;
      font-size: 24px;
      line-height: 1;
      color: var(--bs-muted);
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      transition: all 0.15s ease;
    }
    .bs-drawer-close:hover {
      color: var(--bs-ink);
      background: var(--paper-2, #f1f5f9);
    }

    .bs-drawer-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
    }

    .bs-drawer-article {
      padding: 14px 0;
      border-bottom: 1px solid var(--bs-border);
      display: flex;
      align-items: flex-start;
      gap: 16px;
    }
    .bs-drawer-article:last-child {
      border-bottom: 0;
    }
    .bs-drawer-art-thumb {
      width: 80px;
      height: 60px;
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;

  /* ── Live Search Execution Engine ───────────────────────────── */
  function executeSearch(rawQuery) {
    closeDropdown();
    var query = String(rawQuery || '').trim().replace(/^#/, '');
    var input = $('bs-query-input');
    var clearBtn = $('bs-clear-btn');
    var exploreView = $('bs-explore-view');
    var resultsView = $('bs-results-view');
    var countEl = $('bs-results-count');
    var feedList = $('bs-feed-list');

    if (input) input.value = rawQuery || '';
    if (clearBtn) clearBtn.classList.toggle('visible', !!query);

    if (!query) {
      exploreView.style.display = 'block';
      resultsView.style.display = 'none';
      return;
    }

    exploreView.style.display = 'none';
    resultsView.style.display = 'block';

    if (countEl) countEl.textContent = 'Searching top news & RSS sources...';
    if (feedList) feedList.innerHTML = '<div style="padding:40px 0;text-align:center;color:var(--bs-muted);font-weight:600;"><div style="font-size:18px;margin-bottom:6px;">🔍 Finding real-time sources for "' + escapeHtml(query) + '"...</div><div>Querying newsrooms, publications and RSS feeds...</div></div>';

    renderRelatedTopics(query);

    // Call live feed search API
    fetch('/api/search-feeds?q=' + encodeURIComponent(query))
      .then(function (res) { return res.json(); })
      .then(function (data) {
        var liveFeeds = (data && data.feeds && data.feeds.length) ? data.feeds : [];

        // Also check local curated MASTER_FEEDS for direct matches
        var localMatches = [];
        var qLower = query.toLowerCase();
        MASTER_FEEDS.forEach(function (f) {
          var titleLower = f.title.toLowerCase();
          var domainLower = f.domain.toLowerCase();
          if (titleLower.indexOf(qLower) !== -1 || domainLower.indexOf(qLower) !== -1 || (f.topics && f.topics.some(function(t){ return t.toLowerCase().indexOf(qLower) !== -1; }))) {
            localMatches.push(f);
          }
        });

        // Combine feeds giving 100% PRIORITY to live real-time search feeds
        var combined = [];

        // 1. Add all live real-time feeds first
        liveFeeds.forEach(function(lf) {
          combined.push(lf);
        });

        // 2. Append any matching curated publications that were not in live news
        localMatches.forEach(function(lf) {
          if (!combined.some(function(ex) { return ex.domain === lf.domain || ex.title.toLowerCase() === lf.title.toLowerCase(); })) {
            combined.push(lf);
          }
        });

        if (combined.length === 0) {
          combined = liveFeeds.length ? liveFeeds : localMatches;
        }

        currentRenderedFeeds = combined;
        renderFeedResults(combined, query);
      })
      .catch(function (err) {
        console.error('Fetch error:', err);
        // Fallback to local search
        var localMatches = [];
        var qLower = query.toLowerCase();
        MASTER_FEEDS.forEach(function (f) {
          var titleLower = f.title.toLowerCase();
          if (titleLower.indexOf(qLower) !== -1 || (f.topics && f.topics.some(function(t){ return t.toLowerCase().indexOf(qLower) !== -1; }))) {
            localMatches.push(f);
          }
        });
        currentRenderedFeeds = localMatches;
        renderFeedResults(localMatches, query);
      });
  }

  function toggleFollow(feed, btn) {
    var fid = feed.id;
    var ftitle = feed.title || feed.name;
    var furl = feed.feedUrl || feed.url;
    var isAlreadyFollowing = followedFeedUrls.has(furl) || followedFeedUrls.has(fid);

    if (isAlreadyFollowing) {
      if (w.FollowFolderModal && typeof w.FollowFolderModal.unfollow === 'function') {
        w.FollowFolderModal.unfollow(fid, ftitle, {
          onUnfollow: function () {
            followedFeedUrls.delete(furl);
            followedFeedUrls.delete(fid);
            updateFollowButtonStates();
          }
        });
      } else {
        var api = w.BLINK_WATCHLISTS || w.WatchlistsAPI;
        if (api && typeof (api.remove || api.removeFeed) === 'function') {
          var rm = api.remove || api.removeFeed;
          rm.call(api, fid);
        }
        followedFeedUrls.delete(furl);
        followedFeedUrls.delete(fid);
        updateFollowButtonStates();
        showToast('Removed ' + ftitle + ' from watchlists');
      }
    } else {
      if (w.FollowFolderModal && typeof w.FollowFolderModal.open === 'function') {
        w.FollowFolderModal.open({
          id: fid,
          title: ftitle,
          feedUrl: furl,
          siteUrl: feed.siteUrl || feed.domain || furl,
          icon: feed.icon || '',
          category: feed.category || ''
        }, {
          onFollow: function (savedFeed, chosenFolder) {
            followedFeedUrls.add(furl);
            followedFeedUrls.add(fid);
            if (savedFeed && savedFeed.id) followedFeedUrls.add(savedFeed.id);
            updateFollowButtonStates();
          }
        });
      } else {
        var feedObj = {
          id: fid,
          name: ftitle,
          title: ftitle,
          feedUrl: furl,
          type: 'feed',
          folderId: 'pff_tech'
        };
        var api = w.BLINK_WATCHLISTS || w.WatchlistsAPI;
        if (api && typeof (api.add || api.saveFeed) === 'function') {
          var addFn = api.add || api.saveFeed;
          addFn.call(api, feedObj);
        }
        followedFeedUrls.add(furl);
        followedFeedUrls.add(fid);
        updateFollowButtonStates();
        showToast('✓ Followed ' + ftitle + '!');
      }
    }
  }

    var html = '';
    feeds.forEach(function (f, idx) {
      var isFollowing = followedFeedUrls.has(f.feedUrl) || followedFeedUrls.has(f.id);

      var articlesHtml = '';
      if (f.articles && f.articles.length > 0) {
        articlesHtml += '<div class="bs-fc-articles">';
        f.articles.slice(0, 3).forEach(function (art) {
          var title = typeof art === 'string' ? art : art.title;
          var link = typeof art === 'object' && art.link ? art.link : ('https://' + (f.domain || 'news.google.com'));
          articlesHtml += '<a href="' + escapeAttr(link) + '" target="_blank" rel="noopener noreferrer" class="bs-fc-article" onclick="event.stopPropagation();">'
            + '<span class="bs-fc-article-bullet">›</span>'
            + '<span class="bs-fc-article-text">' + escapeHtml(title) + '</span>'
            + '</a>';
        });
        articlesHtml += '</div>';
      }

      var logoContent = escapeHtml(f.logoText || f.title.slice(0, 3).toUpperCase());
      if (f.visualUrl && f.visualUrl.startsWith('http')) {
        logoContent = '<img src="' + escapeAttr(f.visualUrl) + '" alt="" style="width:100%;height:100%;object-fit:cover;" onerror="this.onerror=null;this.parentNode.innerHTML=\'' + escapeHtml(f.title.slice(0,3).toUpperCase()) + '\';" />';
      } else {
        var faviconSrc = 'https://www.google.com/s2/favicons?domain=' + encodeURIComponent(f.domain || 'news.google.com') + '&sz=64';
        logoContent = '<img src="' + faviconSrc + '" alt="" style="width:28px;height:28px;border-radius:6px;object-fit:contain;" onerror="this.onerror=null;this.parentNode.innerHTML=\'' + escapeHtml(f.title.slice(0,3).toUpperCase()) + '\';" />';
      }

      html += '<div class="bs-feed-card" data-feed-idx="' + idx + '" data-feed-id="' + f.id + '" style="cursor:pointer;">'
        + '<div class="bs-fc-header">'
        + '<div class="bs-fc-logo" style="background:' + (f.logoBg || '#0f172a') + ';color:' + (f.logoColor || '#ffffff') + ';">'
        + logoContent
        + '</div>'
        + '<div class="bs-fc-title-group">'
        + '<div class="bs-fc-title">' + escapeHtml(f.title) + '</div>'
        + '<div class="bs-fc-subinfo">'
        + '<a href="https://' + f.domain + '" target="_blank" rel="noopener noreferrer" class="bs-fc-domain" onclick="event.stopPropagation();">' + escapeHtml(f.domain) + '</a>'
        + '</div>'
        + '</div>'
        + '<div class="bs-fc-actions" onclick="event.stopPropagation();">'
        + '<button type="button" class="bs-similar-btn" data-similar="' + encodeURIComponent(query) + '">Similar feeds</button>'
        + '<button type="button" class="bs-follow-btn' + (isFollowing ? ' following' : '') + '" data-feed-id="' + f.id + '" data-feed-title="' + escapeAttr(f.title) + '" data-feed-url="' + escapeAttr(f.feedUrl) + '">'
        + '<span>' + (isFollowing ? '✓ Following' : '+ Follow') + '</span>'
        + '</button>'
        + '</div>'
        + '</div>'
        + '<p class="bs-fc-desc">' + escapeHtml(f.desc) + '</p>'
        + articlesHtml
        + '<div class="bs-fc-metrics">'
        + '<span>' + (f.followers || '10K') + ' followers</span>'
        + '<span>'
        + '<span class="bs-relevance-bar"><span class="bs-relevance-fill" style="width:' + (f.relevance || 80) + '%;"></span></span>'
        + ' relevance'
        + '</span>'
        + '<span>' + (f.articlesPerWeek || '25 articles per week') + '</span>'
        + '</div>'
        + '</div>';
    });

    container.innerHTML = html;

    // Attach Card Click to Open Drawer Popup
    container.querySelectorAll('.bs-feed-card').forEach(function (card) {
      card.onclick = function (e) {
        var idx = parseInt(card.getAttribute('data-feed-idx'), 10);
        if (!isNaN(idx) && currentRenderedFeeds[idx]) {
          openFeedDrawer(currentRenderedFeeds[idx]);
        }
      };
    });

    // Attach Follow Button Listeners
    container.querySelectorAll('.bs-follow-btn').forEach(function (btn) {
      btn.onclick = function (e) {
        e.preventDefault();
        e.stopPropagation();
        var fid = btn.getAttribute('data-feed-id');
        var matchingFeed = currentRenderedFeeds.find(function(item){ return item.id === fid; });
        if (matchingFeed) {
          toggleFollow(matchingFeed, btn);
        }
      };
    });

    // Attach Similar Feeds Button Listeners
    container.querySelectorAll('.bs-similar-btn').forEach(function (btn) {
      btn.onclick = function (e) {
        e.preventDefault();
        e.stopPropagation();
        var term = decodeURIComponent(btn.getAttribute('data-similar') || query);
        executeSearch(term);
      };
    });
  }

  /* ── Context-Aware Related Topics Hashtags ──────────────────── */
  function renderRelatedTopics(query) {
    var container = $('bs-related-tags');
    if (!container) return;

    var tags = [];
    var qClean = query.toLowerCase().replace(/^#/, '').trim();
    var words = qClean.split(/\s+/).filter(Boolean);
    var category = classifyQuery(qClean);

    // Primary tags based on exact query words
    if (words.length > 1) {
      words.forEach(function(w) { if (w.length > 2 && tags.indexOf(w) === -1) tags.push(w); });
    }
    if (tags.indexOf(qClean) === -1) tags.unshift(qClean);

    if (TOPIC_GRAPH[qClean]) {
      TOPIC_GRAPH[qClean].forEach(function(t) { if (tags.indexOf(t) === -1) tags.push(t); });
    } else if (category === 'politics') {
      ['politics', 'white house', 'congress', 'republicans', 'democrats', 'elections 2026', 'senate', 'supreme court', 'world news'].forEach(function(t) {
        if (tags.indexOf(t) === -1) tags.push(t);
      });
    } else if (category === 'tech') {
      ['tech', 'ai', 'startups', 'software', 'silicon valley', 'venture capital', 'machine learning'].forEach(function(t) {
        if (tags.indexOf(t) === -1) tags.push(t);
      });
    } else if (category === 'business') {
      ['business', 'stocks', 'economy', 'crypto', 'investing', 'wall street', 'finance'].forEach(function(t) {
        if (tags.indexOf(t) === -1) tags.push(t);
      });
    } else if (category === 'sports') {
      ['sports', 'premier league', 'cricket', 'nba', 'formula 1', 'football', 'tennis'].forEach(function(t) {
        if (tags.indexOf(t) === -1) tags.push(t);
      });
    } else {
      ['news', 'breaking news', 'world news', 'investigations', 'updates'].forEach(function(t) {
        if (tags.indexOf(t) === -1) tags.push(t);
      });
    }

    var html = '';
    tags.slice(0, 10).forEach(function (t) {
      html += '<button type="button" class="bs-tag-pill" data-tag="' + escapeAttr(t) + '">'
        + '<span class="hash">#</span> '
        + '<span>' + escapeHtml(t) + '</span>'
        + '</button>';
    });

    container.innerHTML = html;

    // Click on Hashtag Pill -> Replaces Search Key and Dynamically Explores
    container.querySelectorAll('.bs-tag-pill').forEach(function (pill) {
      pill.onclick = function () {
        var targetTag = pill.getAttribute('data-tag');
        executeSearch('#' + targetTag);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };
    });
  }

  /* ── Floating Context Autocomplete Dropdown Controller ──────── */
  function updateDropdown(val) {
    var dropdown = $('bs-autocomplete-dropdown');
    if (!dropdown) return;

    var query = String(val || '').trim().replace(/^#/, '').toLowerCase();
    if (!query || query.length < 1) {
      closeDropdown();
      return;
    }

    // 1. Gather Topic Suggestions
    var topicSuggestions = [];
    topicSuggestions.push(query);

    Object.keys(TOPIC_GRAPH).forEach(function(k) {
      if (k.indexOf(query) !== -1 && topicSuggestions.indexOf(k) === -1) {
        topicSuggestions.push(k);
      }
    });

    // 2. Gather Matching Feeds
    var feedSuggestions = [];
    MASTER_FEEDS.forEach(function (f) {
      var tLower = f.title.toLowerCase();
      var dLower = f.domain.toLowerCase();
      if (tLower.indexOf(query) !== -1 || dLower.indexOf(query) !== -1 || (f.topics && f.topics.some(function(tp){ return tp.indexOf(query) !== -1; }))) {
        feedSuggestions.push(f);
      }
    });

    currentDropdownItems = [];
    selectedDropdownIndex = -1;

    var html = '';

    // Section 1: TOPICS
    if (topicSuggestions.length > 0) {
      html += '<div class="bs-dd-section-title">Topics</div>';
      topicSuggestions.slice(0, 3).forEach(function(t) {
        var idx = currentDropdownItems.length;
        currentDropdownItems.push({ type: 'topic', value: '#' + t });
        html += '<div class="bs-dd-item" data-item-idx="' + idx + '" data-search-val="#' + escapeAttr(t) + '">'
          + '<span class="bs-dd-topic-pill"><span style="opacity:0.6;">#</span> ' + escapeHtml(t) + '</span>'
          + '</div>';
      });
    }

    // Section 2: FEEDS
    if (feedSuggestions.length > 0) {
      html += '<div class="bs-dd-section-title" style="margin-top:4px;">Feeds</div>';
      feedSuggestions.slice(0, 8).forEach(function(f) {
        var idx = currentDropdownItems.length;
        currentDropdownItems.push({ type: 'feed', value: f.title });
        html += '<div class="bs-dd-item" data-item-idx="' + idx + '" data-search-val="' + escapeAttr(f.title) + '">'
          + '<div class="bs-dd-icon" style="background:' + (f.logoBg || '#0f172a') + ';color:' + (f.logoColor || '#ffffff') + ';">'
          + escapeHtml(f.logoText || f.title.slice(0, 3).toUpperCase())
          + '</div>'
          + '<div class="bs-dd-text-group">'
          + '<span class="bs-dd-main-text">' + escapeHtml(f.title) + '</span>'
          + '<span class="bs-dd-sub-text">' + escapeHtml(f.domain) + '</span>'
          + '</div>'
          + '</div>';
      });
    }

    if (currentDropdownItems.length === 0) {
      closeDropdown();
      return;
    }

    dropdown.innerHTML = html;
    dropdown.classList.add('open');

    // Bind item clicks
    dropdown.querySelectorAll('.bs-dd-item').forEach(function(item) {
      item.onmousedown = function(e) {
        e.preventDefault();
        var sVal = item.getAttribute('data-search-val');
        executeSearch(sVal);
      };
    });
  }

  function highlightDropdownItem(index) {
    var dropdown = $('bs-autocomplete-dropdown');
    if (!dropdown) return;
    var items = dropdown.querySelectorAll('.bs-dd-item');
    items.forEach(function(el, i) {
      el.classList.toggle('selected', i === index);
      if (i === index) el.scrollIntoView({ block: 'nearest' });
    });
  }

  function closeDropdown() {
    var dropdown = $('bs-autocomplete-dropdown');
    if (dropdown) {
      dropdown.classList.remove('open');
      dropdown.innerHTML = '';
    }
    selectedDropdownIndex = -1;
    currentDropdownItems = [];
  }

  /* ── Render Explore Mode Catalog ── */
  function renderExploreCatalog() {
    var indWrap = $('bs-industries-container');
    if (indWrap) {
      var indHtml = '';
      INDUSTRIES.forEach(function (item) {
        indHtml += '<div class="bs-ind-card" data-search="' + escapeAttr(item.search) + '">'
          + '<div class="bs-ind-name">' + escapeHtml(item.name) + '</div>'
          + '<div class="bs-ind-feature">'
          + '<div class="bs-ind-logo" style="background:' + item.logoBg + ';">' + escapeHtml(item.logoText) + '</div>'
          + '<div class="bs-ind-meta">'
          + '<span class="bs-ind-feat-label">Featuring</span>'
          + '<span class="bs-ind-publisher">' + escapeHtml(item.publisher) + '</span>'
          + '</div>'
          + '</div>'
          + '</div>';
      });
      indWrap.innerHTML = indHtml;
    }

    var sportsWrap = $('bs-sports-container');
    if (sportsWrap) {
      var spHtml = '';
      SPORTS.forEach(function (item) {
        spHtml += '<div class="bs-ind-card" data-search="' + escapeAttr(item.search) + '">'
          + '<div class="bs-ind-name">' + escapeHtml(item.name) + '</div>'
          + '<div class="bs-ind-feature">'
          + '<div class="bs-ind-logo" style="background:' + item.logoBg + ';">' + escapeHtml(item.logoText) + '</div>'
          + '<div class="bs-ind-meta">'
          + '<span class="bs-ind-feat-label">Featuring</span>'
          + '<span class="bs-ind-publisher">' + escapeHtml(item.publisher) + '</span>'
          + '</div>'
          + '</div>'
          + '</div>';
      });
      sportsWrap.innerHTML = spHtml;
    }

    var skillsWrap = $('bs-skills-container');
    if (skillsWrap) {
      var skHtml = '';
      SKILLS.forEach(function (item) {
        skHtml += '<div class="bs-ind-card" data-search="' + escapeAttr(item.search) + '">'
          + '<div class="bs-ind-name">' + escapeHtml(item.name) + '</div>'
          + '<div class="bs-ind-feature">'
          + '<div class="bs-ind-logo" style="background:' + item.logoBg + ';">' + escapeHtml(item.logoText) + '</div>'
          + '<div class="bs-ind-meta">'
          + '<span class="bs-ind-feat-label">Featuring</span>'
          + '<span class="bs-ind-publisher">' + escapeHtml(item.publisher) + '</span>'
          + '</div>'
          + '</div>'
          + '</div>';
      });
      skillsWrap.innerHTML = skHtml;
    }

    // Bind click events on all Explore tiles and Hero cards
    document.querySelectorAll('[data-search]').forEach(function (card) {
      card.onclick = function (e) {
        e.preventDefault();
        var searchKey = card.getAttribute('data-search');
        executeSearch('#' + searchKey);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };
    });
  }

  /* ── Utilities ──────────────────────────────────────────────── */
  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function escapeAttr(str) {
    if (!str) return '';
    return String(str).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  /* ── Boot Controller ────────────────────────────────────────── */
  function boot() {
    renderExploreCatalog();
    syncFollowedFeeds();

    var input = $('bs-query-input');
    var clearBtn = $('bs-clear-btn');
    var tabs = document.querySelectorAll('.bs-tab');
    var sortSelect = $('bs-sort-select');

    if (input) {
      // Keystrokes -> update dropdown autocomplete
      input.addEventListener('input', function () {
        var val = input.value;
        if (clearBtn) clearBtn.classList.toggle('visible', !!val);
        updateDropdown(val);
      });

      // Keyboard navigation in autocomplete
      input.addEventListener('keydown', function (e) {
        var dropdown = $('bs-autocomplete-dropdown');
        var isOpen = dropdown && dropdown.classList.contains('open');

        if (e.key === 'ArrowDown') {
          if (isOpen && currentDropdownItems.length > 0) {
            e.preventDefault();
            selectedDropdownIndex = (selectedDropdownIndex + 1) % currentDropdownItems.length;
            highlightDropdownItem(selectedDropdownIndex);
          }
        } else if (e.key === 'ArrowUp') {
          if (isOpen && currentDropdownItems.length > 0) {
            e.preventDefault();
            selectedDropdownIndex = (selectedDropdownIndex - 1 + currentDropdownItems.length) % currentDropdownItems.length;
            highlightDropdownItem(selectedDropdownIndex);
          }
        } else if (e.key === 'Enter') {
          e.preventDefault();
          if (isOpen && selectedDropdownIndex >= 0 && currentDropdownItems[selectedDropdownIndex]) {
            executeSearch(currentDropdownItems[selectedDropdownIndex].value);
          } else {
            executeSearch(input.value);
          }
        } else if (e.key === 'Escape') {
          closeDropdown();
        }
      });

      input.addEventListener('focus', function () {
        if (input.value.trim()) updateDropdown(input.value);
      });

      input.addEventListener('blur', function () {
        // Small delay to allow mousedown on dropdown items to fire
        setTimeout(closeDropdown, 200);
      });
    }

    if (clearBtn) {
      clearBtn.onclick = function () {
        if (input) input.value = '';
        closeDropdown();
        executeSearch('');
        if (input) input.focus();
      };
    }

    // Sort select change
    if (sortSelect) {
      sortSelect.addEventListener('change', function () {
        if (input && input.value.trim()) {
          executeSearch(input.value.trim());
        }
      });
    }

    // Top Tabs switcher
    tabs.forEach(function (tab) {
      tab.onclick = function () {
        tabs.forEach(function (t) { t.classList.remove('active'); });
        tab.classList.add('active');
        var tabKey = tab.getAttribute('data-tab');
        if (tabKey === 'reddit') executeSearch('#reddit');
        else if (tabKey === 'newsletters') executeSearch('#newsletters');
        else if (tabKey === 'google-news') executeSearch('#news');
        else executeSearch('');
      };
    });

    // Close drawer handlers
    var drawerCloseBtn = $('bs-drawer-close-btn');
    var drawerBackdrop = $('bs-drawer-backdrop');
    if (drawerCloseBtn) drawerCloseBtn.onclick = closeFeedDrawer;
    if (drawerBackdrop) drawerBackdrop.onclick = closeFeedDrawer;

    // Close on Escape key
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeFeedDrawer();
    });

    if (q) {
      executeSearch(q);
    }

    document.addEventListener('watchlists-changed', syncFollowedFeeds);
    document.addEventListener('rss-feeds-updated', syncFollowedFeeds);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }

})(window);
</script>
