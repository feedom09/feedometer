<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focused 2-Pane Feed Reader — FeedOmeter 2.1</title>
  <link rel="stylesheet" href="styles/feedometer.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22><text y=%2222%22 font-size=%2222%22>📡</text></svg>">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif);
      background: var(--bg-primary, #ffffff);
      color: var(--text-primary, #0f172a);
      line-height: 1.5;
      padding: 1.5rem 2rem 3rem;
      overflow-y: auto;
      overflow-x: hidden;
    }
    .page-container {
      max-width: 1360px;
      margin: 0 auto;
    }
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border-color, #e2e8f0);
    }
    .page-title-group h1 {
      font-family: var(--font-display, 'Quicksand', sans-serif);
      font-size: 1.75rem;
      font-weight: 750;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .page-title-group p {
      font-size: 0.9rem;
      color: var(--text-secondary, #64748b);
      margin-top: 0.25rem;
    }
    .page-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      border-radius: var(--btn-radius, 8px);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border-color, #e2e8f0);
      background: #ffffff;
      color: var(--text-primary, #0f172a);
      transition: all 0.15s ease;
      text-decoration: none;
    }
    .btn:hover {
      background: var(--bg-card-hover, #f8fafc);
      border-color: #cbd5e1;
    }
    .btn-primary {
      background: var(--btn-primary-bg, #0f172a);
      color: #ffffff;
      border-color: var(--btn-primary-bg, #0f172a);
    }
    .btn-primary:hover {
      background: #000000;
      color: #ffffff;
    }
    .btn-danger {
      background: #fef2f2;
      color: #dc2626;
      border-color: #fecaca;
    }
    .btn-danger:hover {
      background: #fee2e2;
    }
    .pill-tabs {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      padding-bottom: 0.5rem;
      margin-bottom: 1.5rem;
    }
    .pill-tab {
      padding: 0.4rem 0.9rem;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      border: 1px solid var(--border-color, #e2e8f0);
      background: #ffffff;
      color: var(--text-secondary, #64748b);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }
    .pill-tab:hover, .pill-tab.active {
      background: var(--text-primary, #0f172a);
      color: #ffffff;
      border-color: var(--text-primary, #0f172a);
    }
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.35rem;
    }
    .article-card {
      background: #ffffff;
      border: 1px solid var(--border-color, #e2e8f0);
      border-radius: 14px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 0.65rem;
      transition: all 0.18s ease;
      position: relative;
      overflow: hidden;
    }
    .article-card:hover {
      border-color: #cbd5e1;
      box-shadow: 0 8px 24px -4px rgba(15, 23, 42, 0.1);
      transform: translateY(-3px);
    }
    /* Visual Media & Face Centering Container */
    .article-card-media {
      width: 100%;
      height: 160px;
      border-radius: 10px;
      background: var(--bg-card-hover, #f1f5f9);
      overflow: hidden;
      position: relative;
    }
    .article-card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% 20%;
      display: block;
      transition: transform 0.25s ease;
    }
    .article-card:hover .article-card-img {
      transform: scale(1.03);
    }
    .article-card-fallback {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      font-size: 2.2rem;
      font-weight: 800;
      color: #475569;
      background: linear-gradient(135deg, #f8fafc, #e2e8f0);
    }
    .article-source-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.78rem;
      color: var(--text-secondary, #64748b);
    }
    .article-source-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      background: var(--bg-card-hover, #f1f5f9);
      font-weight: 600;
      color: var(--text-primary, #0f172a);
    }
    .article-title {
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.35;
      color: var(--text-primary, #0f172a);
      text-decoration: none;
    }
    .article-title:hover {
      color: var(--accent, #0284c7);
    }
    .article-snippet {
      font-size: 0.85rem;
      color: var(--text-secondary, #64748b);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .article-card-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 0.65rem;
      border-top: 1px solid var(--border-color, #f1f5f9);
      margin-top: auto;
    }
    .action-icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.1rem;
      padding: 0.3rem;
      border-radius: 6px;
      color: var(--text-secondary, #64748b);
      transition: all 0.12s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .action-icon-btn:hover {
      background: var(--bg-card-hover, #f1f5f9);
      color: var(--text-primary, #0f172a);
    }
    .action-icon-btn.active-star {
      color: #f59e0b;
    }
    .action-icon-btn.active-bookmark {
      color: #0284c7;
    }
    .search-bar-input {
      width: 100%;
      padding: 0.65rem 1rem;
      border-radius: 10px;
      border: 1px solid var(--border-color, #e2e8f0);
      font-size: 0.9rem;
      margin-bottom: 1.25rem;
      outline: none;
      transition: border-color 0.15s ease;
    }
    .search-bar-input:focus {
      border-color: #0f172a;
    }
    /* Reading Drawer/Modal */
    .reader-modal-backdrop {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 1rem;
    }
    .reader-modal-backdrop.open {
      display: flex;
    }
    .reader-modal {
      background: #ffffff;
      border-radius: 16px;
      max-width: 760px;
      width: 100%;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.25);
      overflow: hidden;
    }
    .reader-modal-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border-color, #e2e8f0);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .reader-modal-body {
      padding: 1.5rem;
      overflow-y: auto;
      line-height: 1.7;
      font-size: 1rem;
    }
    
  body { padding: 0; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
  .reader-split-layout {
    display: flex;
    flex: 1;
    height: 100%;
    overflow: hidden;
  }
  .reader-stream-pane {
    width: 380px;
    min-width: 320px;
    max-width: 440px;
    border-right: 1px solid var(--border-color, #e2e8f0);
    display: flex;
    flex-direction: column;
    background: #fafafa;
  }
  .reader-content-pane {
    flex: 1;
    padding: 2.5rem 3.5rem;
    overflow-y: auto;
    background: #ffffff;
  }
  .stream-pane-header {
    padding: 1rem 1.25rem;
    border-bottom: 1px solid var(--border-color, #e2e8f0);
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .stream-list {
    flex: 1;
    overflow-y: auto;
  }
  .stream-item {
    padding: 1rem 1.25rem;
    border-bottom: 1px solid var(--border-color, #e2e8f0);
    cursor: pointer;
    background: #ffffff;
    transition: background 0.12s ease;
  }
  .stream-item:hover {
    background: #f1f5f9;
  }
  .stream-item.active {
    background: #e2e8f0;
    border-left: 3px solid #0f172a;
  }
  .article-detail-title {
    font-size: 1.85rem;
    font-weight: 800;
    line-height: 1.3;
    margin-bottom: 0.75rem;
    color: #0f172a;
  }
  .article-detail-meta {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    font-size: 0.85rem;
    color: #64748b;
    margin-bottom: 2rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid #e2e8f0;
  }
  .article-detail-body {
    font-size: 1.05rem;
    line-height: 1.8;
    color: #334155;
  }

  </style>
</head>
<body>
  <div class="reader-split-layout">
    
    <!-- Left Stream Pane -->
    <aside class="reader-stream-pane">
      <div class="stream-pane-header">
        <div style="font-weight: 700; font-size: 0.95rem; display: flex; align-items: center; gap: 0.4rem;">
          <span>📡</span> Stream Ingestion
        </div>
        <button class="btn" style="padding: 0.25rem 0.5rem; font-size: 0.75rem;" onclick="fetchStreamRss()">Refresh</button>
      </div>
      <div id="rss-stream-list" class="stream-list">
        <div style="padding: 2rem; text-align: center; color: #64748b;">Loading feed items...</div>
      </div>
    </aside>

    <!-- Right Reading Canvas -->
    <main id="rss-article-canvas" class="reader-content-pane">
      <div style="height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #94a3b8;">
        <span style="font-size: 3rem; margin-bottom: 1rem;">📖</span>
        <p style="font-size: 1.1rem; font-weight: 600;">Select an article from the left stream to read</p>
      </div>
    </main>

  </div>

  <script src="scripts/feedometer-config.js"></script>
  <script src="scripts/feedometer-auth.js"></script>
  <script>
    let articles = [];
    let activeIdx = 0;

    async function fetchStreamRss() {
      const listEl = document.getElementById('rss-stream-list');
      try {
        let json = null;
        if (window.FeedOmeterAuth && window.FeedOmeterAuth.getStream) {
          json = await window.FeedOmeterAuth.getStream({ limit: 40 });
        }
        if (!json || json.status === 'error' || !(json.items && json.items.length)) {
          const apiBase = (window.FEEDOMETER_API_BASE || (window.FeedOmeterConfig && window.FeedOmeterConfig.API_BASE_URL) || 'https://feedometer-api.feedometer.workers.dev').replace(/\/$/, '');
          const res = await fetch(apiBase + '/api/stream?limit=40');
          json = await res.json();
        }
        if (json && json.status === 'error') throw new Error(json.message || 'Stream unavailable');
        const raw = json.items || [];
        articles = raw.map(i => ({
          id: i.id,
          title: i.title,
          url: i.link || i.url,
          snippet: i.summary || i.snippet || i.description || '',
          sourceTitle: (i.source && i.source.title) || i.sourceTitle || 'Feed',
          published: i.published,
          content: i.content || i.summary || i.snippet || i.description || ''
        }));
        if (articles.length === 0) {
          listEl.innerHTML = '<div style="padding: 2rem; color: #64748b;">Follow sources to fill this reader.</div>';
          return;
        }
        renderStreamList();
        if (articles.length > 0) {
          selectArticle(0);
        }
      } catch (e) {
        listEl.innerHTML = '<div style="padding: 2rem; color: #ef4444;">Error fetching stream</div>';
      }
    }

    function renderStreamList() {
      const listEl = document.getElementById('rss-stream-list');
      listEl.innerHTML = articles.map((a, idx) => {
        const title = a.title || 'Untitled';
        const source = a.sourceTitle || 'Feed';
        const dateStr = a.published ? new Date(a.published).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
        return `
          <div class="stream-item ${idx === activeIdx ? 'active' : ''}" onclick="selectArticle(${idx})">
            <div style="display: flex; justify-content: space-between; font-size: 0.75rem; color: #64748b; margin-bottom: 0.25rem;">
              <span>${source}</span>
              <span>${dateStr}</span>
            </div>
            <div style="font-size: 0.9rem; font-weight: 600; line-height: 1.35; color: #0f172a;">${title}</div>
          </div>
        `;
      }).join('');
    }

    function selectArticle(idx) {
      activeIdx = idx;
      renderStreamList();
      const a = articles[idx];
      if (!a) return;

      if (window.FeedOmeterAuth && window.FeedOmeterAuth.isAuthenticated()) {
        window.FeedOmeterAuth.markArticleRead({
          article_id: a.id,
          url: a.url,
          article_data: a
        }).catch(function () {});
      }

      const canvas = document.getElementById('rss-article-canvas');
      canvas.innerHTML = `
        <div style="max-width: 780px; margin: 0 auto;">
          <div class="article-detail-title">${a.title || 'Untitled'}</div>
          <div class="article-detail-meta">
            <span class="article-source-badge">📡 ${a.sourceTitle || 'Feed Source'}</span>
            <span>Published ${a.published ? new Date(a.published).toLocaleString() : 'Recently'}</span>
            <a href="${a.url}" target="_blank" class="btn btn-primary" style="margin-left: auto; padding: 0.35rem 0.75rem; font-size: 0.8rem;">Open Source ↗</a>
          </div>
          <div class="article-detail-body">
            ${a.content || a.summary || a.snippet || '<p>No content preview available.</p>'}
          </div>
        </div>
      `;
    }

    document.addEventListener('DOMContentLoaded', fetchStreamRss);
  </script>
</body>
</html>
