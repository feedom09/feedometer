<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Executive Dashboard — FeedOmeter 2.1</title>
  <link rel="stylesheet" href="styles/feedometer.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22><text y=%2222%22 font-size=%2222%22>📡</text></svg>">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif);
      background: var(--bg-primary, #ffffff);
      color: var(--text-primary, #0f172a);
      line-height: 1.5;
      padding: 1.25rem 1.5rem 3rem;
      overflow-y: auto;
      overflow-x: hidden;
    }
    .page-container {
      max-width: 1750px;
      margin: 0 auto;
    }
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border-color, #e2e8f0);
    }
    .page-title-group h1 {
      font-family: var(--font-display, 'Quicksand', sans-serif);
      font-size: 1.75rem;
      font-weight: 750;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .page-title-group p {
      font-size: 0.9rem;
      color: var(--text-secondary, #64748b);
      margin-top: 0.25rem;
    }
    .page-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      border-radius: var(--btn-radius, 8px);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border-color, #e2e8f0);
      background: #ffffff;
      color: var(--text-primary, #0f172a);
      transition: all 0.15s ease;
      text-decoration: none;
    }
    .btn:hover {
      background: var(--bg-card-hover, #f8fafc);
      border-color: #cbd5e1;
    }
    .btn-primary {
      background: var(--btn-primary-bg, #0f172a);
      color: #ffffff;
      border-color: var(--btn-primary-bg, #0f172a);
    }
    .btn-primary:hover {
      background: #000000;
      color: #ffffff;
    }
    .btn-danger {
      background: #fef2f2;
      color: #dc2626;
      border-color: #fecaca;
    }
    .btn-danger:hover {
      background: #fee2e2;
    }
    .feed-filter-bar {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }
    .feed-filter-bar label {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-secondary, #64748b);
    }
    .feed-filter-select {
      min-width: 260px;
      max-width: 100%;
      height: 38px;
      padding: 0 0.85rem;
      border-radius: 10px;
      border: 1px solid var(--border-color, #e2e8f0);
      background: #ffffff;
      color: var(--text-primary, #0f172a);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
    }
    .feed-filter-select:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }
    .card-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 0.85rem;
    }
    @media (max-width: 1400px) {
      .card-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 0.85rem;
      }
    }
    @media (max-width: 1100px) {
      .card-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 0.75rem;
      }
    }
    @media (max-width: 768px) {
      .card-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.75rem;
      }
    }
    @media (max-width: 480px) {
      .card-grid {
        grid-template-columns: 1fr;
        gap: 0.75rem;
      }
    }
    .article-card {
      background: #ffffff;
      border: 1px solid var(--border-color, #e2e8f0);
      border-radius: 12px;
      padding: 0.75rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 0.5rem;
      transition: all 0.18s ease;
      position: relative;
      overflow: hidden;
    }
    .article-card:hover {
      border-color: #cbd5e1;
      box-shadow: 0 8px 20px -4px rgba(15, 23, 42, 0.08);
      transform: translateY(-2px);
    }
    /* Visual Media & Face Centering Container */
    .article-card-media {
      width: 100%;
      height: 125px;
      border-radius: 8px;
      background: var(--bg-card-hover, #f1f5f9);
      overflow: hidden;
      position: relative;
    }
    .article-card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% 20%;
      display: block;
      transition: transform 0.25s ease;
    }
    .article-card:hover .article-card-img {
      transform: scale(1.03);
    }
    .article-card-fallback {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      font-size: 1.75rem;
      font-weight: 800;
      color: #475569;
      background: linear-gradient(135deg, #f8fafc, #e2e8f0);
    }
    .article-source-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.72rem;
      color: var(--text-secondary, #64748b);
    }
    .article-source-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.15rem 0.45rem;
      border-radius: 999px;
      background: var(--bg-card-hover, #f1f5f9);
      font-weight: 600;
      font-size: 0.70rem;
      color: var(--text-primary, #0f172a);
      max-width: 65%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .article-title {
      font-size: 0.88rem;
      font-weight: 700;
      line-height: 1.3;
      color: var(--text-primary, #0f172a);
      text-decoration: none;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-top: 0.1rem;
    }
    .article-title:hover {
      color: var(--accent, #0284c7);
    }
    .article-snippet {
      font-size: 0.76rem;
      color: var(--text-secondary, #64748b);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .article-card-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 0.45rem;
      border-top: 1px solid var(--border-color, #f1f5f9);
      margin-top: auto;
    }

    .btn-square {
      width: 38px;
      height: 38px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 9px;
      font-size: 1.15rem;
      cursor: pointer;
      border: 1px solid var(--border-color, #e2e8f0);
      background: #ffffff;
      color: var(--text-primary, #0f172a);
      transition: all 0.15s ease;
    }
    .btn-square:hover {
      background: var(--bg-card-hover, #f1f5f9);
      border-color: #cbd5e1;
      transform: translateY(-1px);
    }
    .btn-square-primary {
      background: var(--btn-primary-bg, #0f172a);
      color: #ffffff;
      border-color: var(--btn-primary-bg, #0f172a);
    }
    .btn-square-primary:hover {
      background: #000000;
      color: #ffffff;
      transform: translateY(-1px);
    }
    .btn-square.active-stream {
      background: #fef2f2;
      border-color: #fca5a5;
      color: #ef4444;
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.35);
      animation: flamePulse 1.5s infinite alternate;
    }
    @keyframes flamePulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.08); }
    }
    .action-icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.1rem;
      padding: 0.3rem;
      border-radius: 6px;
      color: var(--text-secondary, #64748b);
      transition: all 0.12s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .action-icon-btn:hover {
      background: var(--bg-card-hover, #f1f5f9);
      color: var(--text-primary, #0f172a);
    }
    .action-icon-btn.active-star {
      color: #f59e0b;
    }
    .action-icon-btn.active-bookmark {
      color: #0284c7;
    }
    .action-icon-btn.disabled-guest-btn {
      opacity: 0.32;
      cursor: not-allowed;
      filter: grayscale(1);
    }
    .action-icon-btn.disabled-guest-btn:hover {
      background: #fef2f2;
      color: #dc2626;
      opacity: 0.75;
    }
    .search-bar-input {
      width: 100%;
      padding: 0.65rem 1rem;
      border-radius: 10px;
      border: 1px solid var(--border-color, #e2e8f0);
      font-size: 0.9rem;
      margin-bottom: 1.25rem;
      outline: none;
      transition: border-color 0.15s ease;
    }
    .search-bar-input:focus {
      border-color: #0f172a;
    }
    /* Reading Drawer/Modal */
    .reader-modal-backdrop {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 1rem;
    }
    .reader-modal-backdrop.open {
      display: flex;
    }
    .reader-modal {
      background: #ffffff;
      border-radius: 16px;
      max-width: 760px;
      width: 100%;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.25);
      overflow: hidden;
    }
    .reader-modal-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border-color, #e2e8f0);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .reader-modal-body {
      padding: 1.5rem;
      overflow-y: auto;
      line-height: 1.7;
      font-size: 1rem;
    }
    

    /* Shimmer Skeleton Placeholder Grid */
    .skeleton-card {
      background: #ffffff;
      border: 1px solid var(--border-color, #e2e8f0);
      border-radius: 12px;
      padding: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      min-height: 220px;
    }
    .skeleton-media {
      width: 100%;
      height: 110px;
      border-radius: 8px;
      background: #f1f5f9;
    }
    .skeleton-badge {
      width: 65px;
      height: 16px;
      border-radius: 4px;
      background: #f1f5f9;
    }
    .skeleton-line {
      height: 14px;
      border-radius: 4px;
      background: #f1f5f9;
    }
    .skeleton-line-sm {
      height: 10px;
      border-radius: 4px;
      background: #f1f5f9;
    }
    .shimmer-animated {
      background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
</head>
<body>
  <div class="page-container">
    <div class="page-header">
      <div class="page-title-group">
        <h1>Intelligence Briefing</h1>
        <p id="feedo-greeting">Live real-time feed telemetry and headlines</p>
      </div>
      <div class="page-actions">
        <button class="btn-square" onclick="fetchStream()" title="Refresh Feeds">🔄</button>
        <button id="btn-live-stream" class="btn-square btn-square-primary" onclick="toggleLiveStream()" title="Toggle Live Stream">🔥</button>
      </div>
    </div>

    <!-- Filter by followed feed (same list as Following) -->
    <div class="feed-filter-bar">
      <label for="briefing-feed-filter">Filter by feed</label>
      <select id="briefing-feed-filter" class="feed-filter-select" aria-label="Filter briefing by followed feed">
        <option value="all">All followed feeds</option>
      </select>
    </div>

    <!-- Articles Grid -->
    <div id="articles-container" class="card-grid">
      <div style="grid-column: 1/-1; text-align: center; padding: 3rem; color: #64748b;">
        <span>📡 Loading live stream intelligence...</span>
      </div>
    </div>
  </div>

  <!-- Article Reader Modal -->
  <div id="reader-modal" class="reader-modal-backdrop" onclick="closeReaderModal(event)">
    <div class="reader-modal" onclick="event.stopPropagation()">
      <div class="reader-modal-header">
        <div id="modal-source-badge" class="article-source-badge">Source</div>
        <button class="action-icon-btn" onclick="closeReaderModal()">✕</button>
      </div>
      <div class="reader-modal-body">
        <h2 id="modal-title" style="margin-bottom: 0.75rem; font-size: 1.35rem; line-height: 1.35;"></h2>
        <div id="modal-meta" style="font-size: 0.8rem; color: #64748b; margin-bottom: 1.25rem;"></div>
        <div id="modal-content" style="line-height: 1.7; color: #334155;"></div>
        <div style="margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center;">
          <a id="modal-link" href="#" target="_blank" class="btn btn-primary">Read Original Article ↗</a>
        </div>
      </div>
    </div>
  </div>

  
  <script src="scripts/feedometer-config.js"></script>
  <script src="scripts/feedometer-auth.js"></script>
  <script src="scripts/smart-crop.js"></script>
  <script src="scripts/feed-imaging.js"></script>
  <script>
    let allArticles = [];
    let selectedFeedKey = 'all';
    let followedFeedOptions = [];
    let isLiveStreaming = false;
    let liveStreamTimer = null;
    let isInitialLoading = true;
    let isFetchingStream = false;
    let hasRenderedInitialState = false;
    let lastAuthUserId = null;

    function renderSkeletonGrid(count = 10) {
      const container = document.getElementById('articles-container');
      if (!container) return;
      let skeletonsHtml = '';
      for (let i = 0; i < count; i++) {
        skeletonsHtml += `
          <div class="skeleton-card">
            <div class="skeleton-media shimmer-animated"></div>
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <div class="skeleton-badge shimmer-animated"></div>
              <div style="width:40px; height:12px; background:#f1f5f9; border-radius:3px;" class="shimmer-animated"></div>
            </div>
            <div class="skeleton-line shimmer-animated" style="width: 90%;"></div>
            <div class="skeleton-line shimmer-animated" style="width: 70%;"></div>
            <div class="skeleton-line-sm shimmer-animated" style="width: 50%;"></div>
          </div>
        `;
      }
      container.innerHTML = skeletonsHtml;
    }

    function normalizeStreamItem(i) {
      return {
        id: i.id,
        title: i.title,
        url: i.link || i.url,
        snippet: i.summary || i.snippet || i.description || '',
        sourceTitle: (i.source && i.source.title) || i.sourceTitle || i.source_title || 'Feed',
        category: i.category || (i.source && i.source.category) || 'General',
        published: i.published,
        image: i.image || i.image_url || '',
        content: i.content || i.summary || i.snippet || i.description || '',
        source_id: i.source_id || (i.source && i.source.id) || '',
        feed_url: (i.source && i.source.feed_url) || i.feed_url || ''
      };
    }

    function briefingCacheKey() {
      return getUserStorageKey('feedometer_cached_briefing_stream');
    }

    function clearBriefingCache() {
      try {
        localStorage.removeItem('feedometer_cached_briefing_stream');
        localStorage.removeItem(briefingCacheKey());
      } catch (e) {}
    }

    function restoreCachedBriefing() {
      try {
        const key = briefingCacheKey();
        let raw = localStorage.getItem(key);
        if (!raw) {
          raw = localStorage.getItem('feedometer_cached_briefing_stream');
        }
        if (raw) {
          const cached = JSON.parse(raw);
          if (Array.isArray(cached) && cached.length > 0) {
            allArticles = cached;
            window._allArticles = allArticles;
            isInitialLoading = false;
            hasRenderedInitialState = true;
            renderArticles(filterArticlesForFeed());
            return true;
          }
        }
      } catch (e) {
        console.warn('Briefing cache restore notice:', e);
      }
      return false;
    }

    async function loadFollowedFeedOptions() {
      const auth = window.FeedOmeterAuth || (window.parent && window.parent.FeedOmeterAuth);
      const rows = [];
      if (isUserLoggedIn() && auth && auth.getSubscriptions) {
        try {
          const json = await auth.getSubscriptions();
          const list = json.subscriptions || json.feeds || [];
          list.forEach(function (s) {
            const url = (s.feed_url || s.url || '').trim();
            const title = (s.title || s.name || s.feed_name || url || 'RSS Feed').trim();
            const id = s.source_id || s.id || '';
            if (url || id) rows.push({ key: url || id, title: title, feed_url: url, source_id: id });
          });
        } catch (e) {}
      } else if (auth && typeof auth.getGuestFollows === 'function') {
        auth.getGuestFollows().forEach(function (s) {
          const url = (s.feed_url || s.url || '').trim();
          const title = (s.feed_name || s.title || url || 'RSS Feed').trim();
          if (url) rows.push({ key: url, title: title, feed_url: url, source_id: '' });
        });
      }
      followedFeedOptions = rows;
      populateFeedFilterSelect();
      return rows;
    }

    function populateFeedFilterSelect() {
      const sel = document.getElementById('briefing-feed-filter');
      if (!sel) return;
      const previous = selectedFeedKey;
      sel.innerHTML = '<option value="all">All followed feeds</option>';
      followedFeedOptions.forEach(function (f) {
        const opt = document.createElement('option');
        opt.value = f.key;
        opt.textContent = f.title;
        sel.appendChild(opt);
      });
      const stillThere = previous === 'all' || followedFeedOptions.some(function (f) { return f.key === previous; });
      selectedFeedKey = stillThere ? previous : 'all';
      sel.value = selectedFeedKey;
    }

    async function countFollowedFeeds() {
      const rows = await loadFollowedFeedOptions();
      if (!isUserLoggedIn()) return rows.length;
      return rows.length;
    }

    function showPersonalEmpty() {
      allArticles = [];
      window._allArticles = [];
      isInitialLoading = false;
      hasRenderedInitialState = true;
      followedFeedOptions = [];
      selectedFeedKey = 'all';
      populateFeedFilterSelect();
      clearBriefingCache();
      renderArticles([]);
    }

    function guestFollowUrls() {
      const auth = window.FeedOmeterAuth || (window.parent && window.parent.FeedOmeterAuth);
      if (isUserLoggedIn() || !auth || typeof auth.getGuestFollows !== 'function') return [];
      return auth.getGuestFollows().map(function (f) {
        return (f && (f.feed_url || f.url)) || '';
      }).filter(Boolean).slice(0, 20);
    }

    // Progressive 2-Tier Stream Loader (Load 20 fast, expand 50 in background)
    async function fetchStream(force) {
      if (isFetchingStream) return;
      isFetchingStream = true;

      const auth = window.FeedOmeterAuth || (window.parent && window.parent.FeedOmeterAuth);
      const loggedIn = isUserLoggedIn();

      // Only show skeletons on first initial load if no cached articles exist, or explicit force refresh
      if (allArticles.length === 0 && (!hasRenderedInitialState || force)) {
        renderSkeletonGrid(15);
      }

      try {
        const guestUrls = guestFollowUrls();
        if (loggedIn) {
          const followCount = await countFollowedFeeds();
          if (followCount === 0) {
            hasRenderedInitialState = true;
            isFetchingStream = false;
            showPersonalEmpty();
            return;
          }
        } else if (!guestUrls.length) {
          hasRenderedInitialState = true;
          isFetchingStream = false;
          showPersonalEmpty();
          return;
        } else {
          await loadFollowedFeedOptions();
        }

        async function loadTray(limit) {
          if (!auth || !auth.getStream) return null;
          if (loggedIn) return auth.getStream({ limit: limit });
          return auth.getStream({ limit: limit, urls: guestUrls.join(',') });
        }

        let json1 = await loadTray(20);
        if (json1 && json1.stream_scope === 'public') json1 = null;

        if (json1 && Array.isArray(json1.items) && json1.items.length > 0) {
          const tier1Articles = json1.items.map(normalizeStreamItem);
          allArticles = tier1Articles;
          window._allArticles = allArticles;
          isInitialLoading = false;
          hasRenderedInitialState = true;
          renderArticles(filterArticlesForFeed());
          try {
            const toSave = JSON.stringify(tier1Articles);
            localStorage.setItem(briefingCacheKey(), toSave);
            localStorage.setItem('feedometer_cached_briefing_stream', toSave);
          } catch (e) {}
        } else if (allArticles.length === 0) {
          hasRenderedInitialState = true;
          showPersonalEmpty();
        }

        if (allArticles.length > 0) {
          try {
            let json2 = await loadTray(50);
            if (json2 && json2.stream_scope === 'public') json2 = null;

            if (json2 && Array.isArray(json2.items) && json2.items.length > 0) {
              const fullArticles = json2.items.map(normalizeStreamItem);
              const existingIds = new Set(allArticles.map(a => a.id || a.url));
              let addedCount = 0;
              fullArticles.forEach(item => {
                const key = item.id || item.url;
                if (!existingIds.has(key)) {
                  allArticles.push(item);
                  existingIds.add(key);
                  addedCount++;
                }
              });

              if (addedCount > 0) {
                window._allArticles = allArticles;
                renderArticles(filterArticlesForFeed());
                try {
                  const toSave = JSON.stringify(allArticles.slice(0, 50));
                  localStorage.setItem(briefingCacheKey(), toSave);
                  localStorage.setItem('feedometer_cached_briefing_stream', toSave);
                } catch (e) {}
              }
            }
          } catch (err2) {
            console.warn('Tier 2 stream notice:', err2.message);
          }
        }
      } catch (err1) {
        console.warn('Stream fetch notice:', err1.message);
        if (allArticles.length === 0) {
          hasRenderedInitialState = true;
          showPersonalEmpty();
        }
      } finally {
        isInitialLoading = false;
        isFetchingStream = false;
      }
    }

    function canonFeedUrl(u) {
      const raw = String(u || '').trim();
      if (!raw) return '';
      try {
        const p = new URL(raw);
        p.hash = '';
        p.hostname = p.hostname.toLowerCase();
        let href = p.href.toLowerCase();
        if (href.endsWith('/')) href = href.slice(0, -1);
        return href.replace(/^https:/, 'http:');
      } catch (e) {
        return raw.toLowerCase().replace(/\/$/, '').replace(/^https:/, 'http:');
      }
    }

    function filterArticlesForFeed() {
      if (selectedFeedKey === 'all') return allArticles;
      const chosen = followedFeedOptions.find(function (f) { return f.key === selectedFeedKey; });
      const wantUrl = canonFeedUrl((chosen && chosen.feed_url) || selectedFeedKey);
      const wantId = chosen ? String(chosen.source_id || '').toLowerCase() : '';
      const wantTitle = chosen ? String(chosen.title || '').toLowerCase() : '';
      return allArticles.filter(function (a) {
        const aUrl = canonFeedUrl(a.feed_url);
        const aId = String(a.source_id || '').toLowerCase();
        const aTitle = String(a.sourceTitle || '').toLowerCase();
        if (wantUrl && aUrl && aUrl === wantUrl) return true;
        if (wantId && aId && aId === wantId) return true;
        if (wantTitle && aTitle && aTitle === wantTitle) return true;
        return false;
      });
    }

    function switchFeedFilter(key) {
      selectedFeedKey = key || 'all';
      renderArticles(filterArticlesForFeed());
    }

    function getActiveUser() {
      try {
        if (window.FeedOmeterAuth && window.FeedOmeterAuth.getUser()) return window.FeedOmeterAuth.getUser();
        if (window.parent && window.parent.FeedOmeterAuth && window.parent.FeedOmeterAuth.getUser()) return window.parent.FeedOmeterAuth.getUser();
        const raw = localStorage.getItem('feedometer_user_profile');
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      return null;
    }

    function isUserLoggedIn() {
      try {
        if (window.FeedOmeterAuth && window.FeedOmeterAuth.isAuthenticated()) return true;
        if (window.parent && window.parent.FeedOmeterAuth && window.parent.FeedOmeterAuth.isAuthenticated()) return true;
        const profile = localStorage.getItem('feedometer_user_profile');
        const token = localStorage.getItem('feedometer_session_token');
        return Boolean(profile || token);
      } catch (e) {
        return false;
      }
    }

    function getUserStorageKey(baseKey) {
      const user = getActiveUser();
      const uid = user && (user.id || user.email || user.sub) ? (user.id || user.email || user.sub) : 'default';
      return `${baseKey}_${uid}`;
    }

    function isArticleStarred(id) {
      if (!isUserLoggedIn()) return false;
      const list = JSON.parse(localStorage.getItem(getUserStorageKey('feedo_starred_cache')) || '[]');
      return list.includes(id);
    }

    function isArticleReadLater(id) {
      if (!isUserLoggedIn()) return false;
      const list = JSON.parse(localStorage.getItem(getUserStorageKey('feedo_readlater_cache')) || '[]');
      return list.includes(id);
    }

    function promptSignIn() {
      if (window.parent && window.parent.showAuthModal) {
        window.parent.showAuthModal();
      } else if (typeof showAuthModal === 'function') {
        showAuthModal();
      } else {
        alert('Please sign in to star articles and save to your personal reading queue.');
      }
    }

    async function toggleStar(id, btn) {
      if (!isUserLoggedIn()) {
        promptSignIn();
        return;
      }
      const article = allArticles.find(a => a.id === id);
      const payload = window.FeedOmeterAuth.buildArticlePayload(article || { id: id });
      const isStarred = isArticleStarred(id);
      try {
        if (isStarred) {
          await window.FeedOmeterAuth.unstarArticle(id, article && article.url);
          btn.classList.remove('active-star');
          btn.textContent = '☆';
        } else {
          await window.FeedOmeterAuth.starArticle(payload);
          btn.classList.add('active-star');
          btn.textContent = '★';
        }
        const key = getUserStorageKey('feedo_starred_cache');
        let list = JSON.parse(localStorage.getItem(key) || '[]');
        if (isStarred) list = list.filter(x => x !== id);
        else if (!list.includes(id)) list.push(id);
        localStorage.setItem(key, JSON.stringify(list));
      } catch (e) {
        alert(e.message || 'Could not update star');
      }
    }

    async function toggleReadLater(id, btn) {
      if (!isUserLoggedIn()) {
        promptSignIn();
        return;
      }
      const article = allArticles.find(a => a.id === id);
      const payload = window.FeedOmeterAuth.buildArticlePayload(article || { id: id });
      const isQueued = isArticleReadLater(id);
      try {
        if (isQueued) {
          await window.FeedOmeterAuth.unsaveArticle(id, article && article.url);
          btn.classList.remove('active-bookmark');
          btn.textContent = '📑';
        } else {
          await window.FeedOmeterAuth.saveArticle(payload);
          btn.classList.add('active-bookmark');
          btn.textContent = '🔖';
        }
        const key = getUserStorageKey('feedo_readlater_cache');
        let list = JSON.parse(localStorage.getItem(key) || '[]');
        if (isQueued) list = list.filter(x => x !== id);
        else if (!list.includes(id)) list.push(id);
        localStorage.setItem(key, JSON.stringify(list));
      } catch (e) {
        alert(e.message || 'Could not update queue');
      }
    }

    function renderArticles(itemsToRender) {
      const container = document.getElementById('articles-container');
      const list = itemsToRender || filterArticlesForFeed();
      const loggedIn = isUserLoggedIn();

      if (list.length === 0) {
        if (isInitialLoading) {
          renderSkeletonGrid(15);
          return;
        }

        const filteredEmpty = allArticles.length > 0 && selectedFeedKey !== 'all';
        const emptyTitle = filteredEmpty ? 'No articles from this feed' : 'Your stream is empty';
        const emptyCopy = filteredEmpty
          ? 'This feed has no items in the current tray. Choose All followed feeds or another source.'
          : 'Follow sources to build this briefing. Guest follows last for this window only. Accounts keep follows in the database.';
        container.innerHTML = `
          <div style="grid-column: 1/-1; text-align: center; padding: 3.5rem 1.5rem; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; margin: 1rem 0;">
            <div style="font-size: 2.5rem; margin-bottom: 0.75rem;">📡</div>
            <h3 style="font-family: var(--font-display, 'Quicksand', sans-serif); font-size: 1.3rem; font-weight: 700; color: #0f172a; margin-bottom: 0.4rem;">
              ${emptyTitle}
            </h3>
            <p style="font-size: 0.9rem; color: #64748b; max-width: 480px; margin: 0 auto 1.25rem; line-height: 1.5;">
              ${emptyCopy}
            </p>
            <div style="display: flex; justify-content: center; gap: 0.75rem; flex-wrap: wrap;">
              <button class="btn btn-primary" onclick="fetchStream()">🔄 Refresh Stream</button>
              <button class="btn" onclick="window.parent.loadView && window.parent.loadView('find-feeds.html')">🔍 Discover More Feeds</button>
            </div>
          </div>
        `;
        return;
      }

      container.innerHTML = list.map((a, idx) => {
        const title = a.title || 'Untitled';
        const snippet = a.snippet || a.summary || a.description || '';
        const source = a.sourceTitle || 'Feed';
        const dateStr = a.published ? new Date(a.published).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
        const isStarred = isArticleStarred(a.id);
        const isReadLater = isArticleReadLater(a.id);

        const mediaHtml = window.FeedImaging 
          ? window.FeedImaging.renderMedia(a, { className: 'article-card-img', fallbackClass: 'article-card-fallback' })
          : (a.image ? `<img class="article-card-img" src="${a.image}" alt="" loading="lazy" referrerpolicy="no-referrer" />` : `<div class="article-card-fallback">${source[0]}</div>`);

        const starBtnHtml = loggedIn
          ? `<button class="action-icon-btn ${isStarred ? 'active-star' : ''}" title="${isStarred ? 'Unstar Article' : 'Star Article'}" onclick="toggleStar('${a.id}', this)">${isStarred ? '★' : '☆'}</button>`
          : `<button class="action-icon-btn disabled-guest-btn" title="Sign in to star articles" onclick="toggleStar('${a.id}', this)">☆</button>`;

        const readLaterBtnHtml = loggedIn
          ? `<button class="action-icon-btn ${isReadLater ? 'active-bookmark' : ''}" title="${isReadLater ? 'Remove from Queue' : 'Read Later'}" onclick="toggleReadLater('${a.id}', this)">${isReadLater ? '🔖' : '📑'}</button>`
          : `<button class="action-icon-btn disabled-guest-btn" title="Sign in to save for later" onclick="toggleReadLater('${a.id}', this)">📑</button>`;

        return `
          <div class="article-card ${a.isNew ? 'new-pulse-card' : ''}">
            <div class="article-card-media">
              ${mediaHtml}
            </div>
            <div class="article-source-row">
              <span class="article-source-badge">${source}</span>
              <span>${dateStr}</span>
            </div>
            <a href="javascript:void(0)" class="article-title" onclick="openReaderModal(${idx})">${title}</a>
            <p class="article-snippet">${snippet}</p>
            <div class="article-card-actions">
              <div style="display: flex; gap: 0.25rem;">
                ${starBtnHtml}
                ${readLaterBtnHtml}
              </div>
              <a href="${a.url}" target="_blank" rel="noopener noreferrer" class="action-icon-btn" title="Open in New Tab">↗</a>
            </div>
          </div>
        `;
      }).join('');

      if (window.SmartCrop) {
        window.SmartCrop.applyAll(container);
      }
    }

    function openReaderModal(idx, cat) {
      const list = filterArticlesForFeed();
      const a = list[idx];
      if (!a) return;

      document.getElementById('modal-source-badge').textContent = a.sourceTitle || 'Feed Source';
      document.getElementById('modal-title').textContent = a.title || 'Untitled';
      document.getElementById('modal-meta').textContent = `Published: ${a.published ? new Date(a.published).toLocaleString() : 'Recent'}`;
      document.getElementById('modal-content').innerHTML = a.content || a.summary || a.snippet || '<p>No content preview available. Please open the original article.</p>';
      document.getElementById('modal-link').href = a.url || '#';
      document.getElementById('reader-modal').classList.add('open');
      if (window.FeedOmeterAuth && window.FeedOmeterAuth.isAuthenticated()) {
        window.FeedOmeterAuth.markArticleRead({
          article_id: a.id,
          url: a.url,
          article_data: a
        }).catch(function () {});
      }
    }

    function closeReaderModal() {
      document.getElementById('reader-modal').classList.remove('open');
    }

    function toggleLiveStream() {
      const btn = document.getElementById('btn-live-stream');
      if (isLiveStreaming) {
        clearInterval(liveStreamTimer);
        isLiveStreaming = false;
        if (btn) {
          btn.classList.remove('active-stream');
          btn.title = 'Start Live Stream';
        }
      } else {
        isLiveStreaming = true;
        if (btn) {
          btn.classList.add('active-stream');
          btn.title = 'Pause Live Stream (Active)';
        }
        liveStreamTimer = setInterval(() => {
          fetchStream();
        }, 15000);
      }
    }

    const feedFilter = document.getElementById('briefing-feed-filter');
    if (feedFilter) {
      feedFilter.addEventListener('change', function () {
        switchFeedFilter(feedFilter.value);
      });
    }

    function updateGreeting(user) {
      const now = new Date();
      const hour = now.getHours();
      const greet = hour < 12 ? 'Good Morning' : hour < 17 ? 'Good Afternoon' : 'Good Evening';
      const name = user ? (user.name || (user.email ? user.email.split('@')[0] : '')) : '';
      const greetingEl = document.getElementById('feedo-greeting');
      if (greetingEl) {
        greetingEl.textContent = user && name
          ? `${greet}, ${name}. Here is your live feed intelligence.` 
          : 'Live real-time feed telemetry and headlines';
      }
    }

    // Listen for auth state change
    window.addEventListener('feedometer:auth_change', (e) => {
      const user = (e.detail && e.detail.user) || (window.FeedOmeterAuth ? window.FeedOmeterAuth.getUser() : null);
      updateGreeting(user);

      const newUserId = user ? (user.id || user.email) : null;
      if (newUserId === lastAuthUserId && hasRenderedInitialState) {
        // User identity did not change; avoid destructive DOM wipe
        return;
      }
      lastAuthUserId = newUserId;
      
      const hasCached = restoreCachedBriefing();
      if (!hasCached) {
        isInitialLoading = true;
        allArticles = [];
        window._allArticles = [];
      }
      fetchStream(true);
    });

    // Init
    document.addEventListener('DOMContentLoaded', () => {
      const user = window.FeedOmeterAuth ? window.FeedOmeterAuth.getUser() : null;
      lastAuthUserId = user ? (user.id || user.email) : null;
      updateGreeting(user);
      
      // SWR: Instantly paint from cache in 0ms (no skeleton flash if cached)
      restoreCachedBriefing();
      
      fetchStream(false);
    });
  </script>
</body>
</html>
