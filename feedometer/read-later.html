<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Read Later Queue — FeedOmeter 2.1</title>
  <link rel="stylesheet" href="styles/feedometer.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22><text y=%2222%22 font-size=%2222%22>📡</text></svg>">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif);
      background: var(--bg-primary, #ffffff);
      color: var(--text-primary, #0f172a);
      line-height: 1.5;
      padding: 1.5rem 2rem 3rem;
      overflow-y: auto;
      overflow-x: hidden;
    }
    .page-container {
      max-width: 1360px;
      margin: 0 auto;
    }
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border-color, #e2e8f0);
    }
    .page-title-group h1 {
      font-family: var(--font-display, 'Quicksand', sans-serif);
      font-size: 1.75rem;
      font-weight: 750;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .page-title-group p {
      font-size: 0.9rem;
      color: var(--text-secondary, #64748b);
      margin-top: 0.25rem;
    }
    .page-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      border-radius: var(--btn-radius, 8px);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border-color, #e2e8f0);
      background: #ffffff;
      color: var(--text-primary, #0f172a);
      transition: all 0.15s ease;
      text-decoration: none;
    }
    .btn:hover {
      background: var(--bg-card-hover, #f8fafc);
      border-color: #cbd5e1;
    }
    .btn-primary {
      background: var(--btn-primary-bg, #0f172a);
      color: #ffffff;
      border-color: var(--btn-primary-bg, #0f172a);
    }
    .btn-primary:hover {
      background: #000000;
      color: #ffffff;
    }
    .btn-danger {
      background: #fef2f2;
      color: #dc2626;
      border-color: #fecaca;
    }
    .btn-danger:hover {
      background: #fee2e2;
    }
    .pill-tabs {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      padding-bottom: 0.5rem;
      margin-bottom: 1.5rem;
    }
    .pill-tab {
      padding: 0.4rem 0.9rem;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      border: 1px solid var(--border-color, #e2e8f0);
      background: #ffffff;
      color: var(--text-secondary, #64748b);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }
    .pill-tab:hover, .pill-tab.active {
      background: var(--text-primary, #0f172a);
      color: #ffffff;
      border-color: var(--text-primary, #0f172a);
    }
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.35rem;
    }
    .article-card {
      background: #ffffff;
      border: 1px solid var(--border-color, #e2e8f0);
      border-radius: 14px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 0.75rem;
      transition: all 0.18s ease;
      position: relative;
      overflow: hidden;
      height: auto;
      align-self: start;
    }
    .article-card:hover {
      border-color: #cbd5e1;
      box-shadow: 0 8px 24px -4px rgba(15, 23, 42, 0.1);
      transform: translateY(-3px);
    }
    /* Visual Media — fixed aspect, never stretch */
    .article-card-media {
      width: 100%;
      height: auto;
      min-height: 180px;
      aspect-ratio: 16 / 9;
      border-radius: 10px;
      background: var(--bg-card-hover, #f1f5f9);
      overflow: hidden;
      position: relative;
      flex: 0 0 auto;
    }
    .article-card-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      max-width: none;
      max-height: none;
      object-fit: cover;
      object-position: 50% 28%;
      display: block;
      transition: transform 0.25s ease;
    }
    .article-card:hover .article-card-img {
      transform: scale(1.03);
    }
    .article-card-fallback {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      font-size: 2.2rem;
      font-weight: 800;
      color: #475569;
      background: linear-gradient(135deg, #f8fafc, #e2e8f0);
    }
    .article-source-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.78rem;
      color: var(--text-secondary, #64748b);
    }
    .article-source-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      background: var(--bg-card-hover, #f1f5f9);
      font-weight: 600;
      color: var(--text-primary, #0f172a);
    }
    .article-title {
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.35;
      color: var(--text-primary, #0f172a);
      text-decoration: none;
    }
    .article-title:hover {
      color: var(--accent, #0284c7);
    }
    .article-snippet {
      font-size: 0.85rem;
      color: var(--text-secondary, #64748b);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .article-card-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 0.65rem;
      border-top: 1px solid var(--border-color, #f1f5f9);
      margin-top: auto;
    }
    .action-icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.1rem;
      padding: 0.3rem;
      border-radius: 6px;
      color: var(--text-secondary, #64748b);
      transition: all 0.12s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .action-icon-btn:hover {
      background: var(--bg-card-hover, #f1f5f9);
      color: var(--text-primary, #0f172a);
    }
    .action-icon-btn.active-star {
      color: #f59e0b;
    }
    .action-icon-btn.active-bookmark {
      color: #0284c7;
    }
    .search-bar-input {
      width: 100%;
      padding: 0.65rem 1rem;
      border-radius: 10px;
      border: 1px solid var(--border-color, #e2e8f0);
      font-size: 0.9rem;
      margin-bottom: 1.25rem;
      outline: none;
      transition: border-color 0.15s ease;
    }
    .search-bar-input:focus {
      border-color: #0f172a;
    }
    /* Reading Drawer/Modal */
    .reader-modal-backdrop {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 1rem;
    }
    .reader-modal-backdrop.open {
      display: flex;
    }
    .reader-modal {
      background: #ffffff;
      border-radius: 16px;
      max-width: 760px;
      width: 100%;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.25);
      overflow: hidden;
    }
    .reader-modal-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border-color, #e2e8f0);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .reader-modal-body {
      padding: 1.5rem;
      overflow-y: auto;
      line-height: 1.7;
      font-size: 1rem;
    }
    
  </style>
</head>
<body>
  <div class="page-container">
    <div class="page-header">
      <div class="page-title-group">
        <h1>Read Later Queue</h1>
        <p>Curated reading list queued for your focused offline or downtime review</p>
      </div>
      <div class="page-actions">
        <button class="btn btn-primary" onclick="loadQueue()"><span>🔄</span> Refresh</button>
      </div>
    </div>

    <div id="queue-grid" class="card-grid">
      <div style="grid-column: 1/-1; text-align: center; padding: 3rem; color: #64748b;">
        <span>🔖 Loading your reading queue...</span>
      </div>
    </div>
  </div>

  <script src="scripts/feedometer-config.js"></script>
  <script src="scripts/feedometer-auth.js"></script>
  <script src="scripts/smart-crop.js"></script>
  <script src="scripts/feed-imaging.js"></script>
  <script>
    let queueArticles = [];

    async function loadQueue() {
      const grid = document.getElementById('queue-grid');
      if (!window.FeedOmeterAuth || !window.FeedOmeterAuth.isAuthenticated()) {
        grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 3rem; color: #64748b;">Sign in to see your reading queue.</div>';
        return;
      }
      try {
        const json = await window.FeedOmeterAuth.getSavedArticles();
        const raw = json.items || [];
        queueArticles = raw.map(function (a) {
          return {
            id: a.id,
            title: a.title,
            url: a.url,
            snippet: a.snippet || a.summary || '',
            sourceTitle: a.source_title || 'Feed',
            content: a.content || '',
            image: a.image_url || a.image,
            image_url: a.image_url || a.image,
            published: a.published_at || a.published
          };
        });
        renderQueue();
      } catch (e) {
        grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 3rem; color: #64748b;">Your reading queue is empty. Click 🔖 on any article to add it here.</div>';
      }
    }

    function renderQueue() {
      const grid = document.getElementById('queue-grid');
      if (queueArticles.length === 0) {
        grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 3rem; color: #64748b;">Your reading queue is empty. Save articles for later with the 🔖 icon!</div>';
        return;
      }

      grid.innerHTML = queueArticles.map((a, idx) => {
        const title = a.title || 'Untitled Queue Item';
        const snippet = a.snippet || a.summary || a.description || '';
        const source = a.sourceTitle || 'Feed';

        const mediaHtml = window.FeedImaging 
          ? window.FeedImaging.renderMedia(a, { className: 'article-card-img', fallbackClass: 'article-card-fallback' })
          : (a.image ? `<img class="article-card-img" src="${a.image}" alt="" loading="lazy" referrerpolicy="no-referrer" />` : `<div class="article-card-fallback">${source[0]}</div>`);

        return `
          <div class="article-card" data-article-id="${a.id}">
            <div class="article-card-media">
              ${mediaHtml}
            </div>
            <div class="article-source-row">
              <span class="article-source-badge">🔖 ${source}</span>
            </div>
            <a href="${a.url}" target="_blank" class="article-title">${title}</a>
            <p class="article-snippet">${snippet}</p>
            <div class="article-card-actions">
              <button class="btn" style="padding: 0.25rem 0.6rem; font-size: 0.78rem;" onclick="markRead('${a.id}')">
                ✓ Mark Read
              </button>
              <a href="${a.url}" target="_blank" class="btn btn-primary" style="padding: 0.25rem 0.6rem; font-size: 0.78rem;">Read Now ↗</a>
            </div>
          </div>
        `;
      }).join('');

      if (window.SmartCrop) {
        window.SmartCrop.applyAll(grid);
      }
    }

    async function markRead(id) {
      const article = queueArticles.find(a => a.id === id);
      try {
        if (window.FeedOmeterAuth) {
          await window.FeedOmeterAuth.markArticleRead({
            article_id: id,
            url: article && article.url,
            article_data: article || { id: id }
          });
          await window.FeedOmeterAuth.unsaveArticle(id, article && article.url);
        }
        queueArticles = queueArticles.filter(a => a.id !== id);
        renderQueue();
      } catch (e) {
        alert(e.message || 'Could not mark read');
      }
    }

    document.addEventListener('DOMContentLoaded', loadQueue);
  </script>
  <script src="scripts/feedometer-article-tags.js"></script>
</body>
</html>
