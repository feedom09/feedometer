name = "feedometer"
main = "workers/feedometer-worker.js"
compatibility_date = "2024-11-12"
compatibility_flags = ["nodejs_compat"]
account_id = "8f1374c9aa2834729c9f4286eea1ac79"

[vars]
ENVIRONMENT = "production"
WORKER_PUBLIC_URL = "https://feedom.feedom-8f1.workers.dev"
# Current Pages application hostname used for browser-facing links in
# transactional email. This must never point at the retired legacy Pages site.
APP_PUBLIC_URL = "https://feedometer-4vg.pages.dev"
# Verified Resend sender identity for the current development/test environment.
# MAIL_FROM = "FeedOmeter <noreply@mail.ev2rule.com>"
ADMIN_NOTIFY_EMAIL = "feedom@peopledotsports.com"
# GOOGLE_CLIENT_ID = "519822758554-19n3plblqq2nqago9r619kg5bi265674.apps.googleusercontent.com"

[[kv_namespaces]]
binding = "FEEDS_KV"
id = "283f4fb21d6c480184757d1f95767192"

# Browser Rendering for Visual Builder (JS-heavy sites). Enable in Cloudflare dashboard first.
[browser]
binding = "BROWSER"

[ai]
# binding = "AI"

# [observability]
# [observability.logs]
# enabled = true
# invocation_logs = true
# persist = true

# Scheduled crons: daily background refresh & synchronization at 13:00 UTC (6:30 PM IST)
# [triggers]
# crons = ["0 13 * * *"]
