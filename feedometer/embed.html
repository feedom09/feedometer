<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FeedOmeter Live Feed Widget</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="scripts/feedometer-config.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      min-height: 100%;
      background: transparent;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #0f172a;
      -webkit-font-smoothing: antialiased;
    }
    .widget-container {
      width: 100%;
      padding: 1rem;
      border-radius: var(--w-card-radius, 12px);
      background-color: var(--w-bg, #ffffff);
      color: var(--w-text, #0f172a);
      font-family: var(--w-font, 'Inter', sans-serif);
    }
    
    /* Header */
    .widget-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
      gap: 0.5rem;
    }
    .widget-header.align-center {
      justify-content: center;
      text-align: center;
      flex-direction: column;
    }
    .widget-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--w-text, #0f172a);
    }
    .widget-badge {
      font-size: 0.7rem;
      font-weight: 750;
      color: var(--w-accent, #10b981);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Layouts */
    .layout-news-wall {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
    }
    .layout-carousel {
      display: flex;
      gap: 1rem;
      overflow-x: auto;
      padding-bottom: 0.5rem;
      scroll-snap-type: x mandatory;
    }
    .layout-carousel .widget-card {
      flex: 0 0 260px;
      scroll-snap-align: start;
    }
    /* 3. Ticker (Continuous Floating Headlines Marquee) */
    .layout-ticker {
      display: flex !important;
      align-items: center !important;
      overflow: hidden !important;
      background: var(--w-card-bg, #ffffff) !important;
      border: 1px solid var(--w-card-border, #e2e8f0) !important;
      border-radius: var(--w-card-radius, 8px) !important;
      box-shadow: 0 2px 8px -2px rgba(0, 0, 0, 0.05);
      position: relative !important;
      padding: 0 !important;
      height: 46px !important;
      width: 100% !important;
    }
    .ticker-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0 0.85rem;
      height: 100%;
      background: var(--w-accent, #10b981);
      color: #ffffff !important;
      font-size: 0.7rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      white-space: nowrap;
      flex-shrink: 0;
      z-index: 2;
    }
    .ticker-track-wrap {
      flex: 1;
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      height: 100%;
    }
    .ticker-track {
      display: inline-flex;
      align-items: center;
      white-space: nowrap;
      animation: tickerMarquee 30s linear infinite;
      will-change: transform;
    }
    .ticker-track-wrap:hover .ticker-track {
      animation-play-state: paused;
    }
    @keyframes tickerMarquee {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    .ticker-item {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0 1.15rem;
      text-decoration: none !important;
      color: var(--w-text, #0f172a) !important;
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
    }
    .ticker-item:hover .ticker-title {
      color: var(--w-accent, #10b981) !important;
      text-decoration: underline;
    }
    .ticker-source {
      font-size: 0.65rem;
      font-weight: 750;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--w-text-muted, #64748b);
      background: rgba(0, 0, 0, 0.05);
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
    }
    .ticker-sep {
      color: var(--w-accent, #10b981);
      font-size: 0.6rem;
      margin-left: 0.65rem;
      opacity: 0.8;
    }
    .layout-magazine {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 1rem;
    }
    @media (max-width: 600px) {
      .layout-magazine { grid-template-columns: 1fr; }
    }
    .layout-list {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }
    .layout-list .widget-card {
      flex-direction: row;
      align-items: center;
      padding: 0.65rem;
    }
    .layout-list .widget-card-media {
      width: 68px;
      height: 68px;
      margin-right: 0.75rem;
      flex-shrink: 0;
    }
    .layout-imageboard {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 0.85rem;
    }
    .layout-imageboard .widget-card {
      position: relative;
      overflow: hidden;
    }
    .layout-imageboard .widget-card-media {
      height: 200px;
    }
    .layout-imageboard .widget-card-body {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: linear-gradient(transparent, rgba(0,0,0,0.85));
      color: #ffffff !important;
      padding: 1.25rem 0.65rem 0.65rem;
    }
    .layout-imageboard .widget-card-title {
      color: #ffffff !important;
    }

    /* Card Anatomy */
    .widget-card {
      background: var(--w-card-bg, #ffffff);
      border: 1px solid var(--w-card-border, #e2e8f0);
      border-radius: var(--w-card-radius, 12px);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
      height: 100%;
    }
    .widget-card:hover {
      transform: translateY(-2px);
      border-color: #cbd5e1;
    }

    /* Shadows */
    .widget-card.shadow-none { box-shadow: none; }
    .widget-card.shadow-soft { box-shadow: 0 2px 8px -2px rgba(0, 0, 0, 0.05); }
    .widget-card.shadow-raised { box-shadow: 0 10px 25px -4px rgba(0, 0, 0, 0.12); }
    .widget-card.shadow-glow { box-shadow: 0 0 14px -2px var(--w-accent, rgba(16, 185, 129, 0.3)); }

    .widget-card-media {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #f1f5f9;
      overflow: hidden;
      display: block;
      position: relative;
    }
    .widget-card-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .widget-card-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.75rem;
      background: linear-gradient(135deg, #f8fafc, #e2e8f0);
    }
    .widget-card-body {
      padding: 0.75rem 0.85rem 0.85rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .widget-card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.3rem;
    }
    .widget-card-domain {
      font-size: 0.68rem;
      font-weight: 750;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--w-text-muted, #64748b);
    }
    .widget-card-title {
      font-size: 0.88rem;
      font-weight: 750;
      color: var(--w-text, #0f172a);
      line-height: 1.35;
      margin-bottom: 0.35rem;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .widget-card-title:hover {
      color: var(--w-accent, #10b981);
    }
    .widget-card-title.clamp-1 { -webkit-line-clamp: 1; }
    .widget-card-title.clamp-2 { -webkit-line-clamp: 2; }
    .widget-card-title.clamp-3 { -webkit-line-clamp: 3; }

    .widget-card-desc {
      font-size: 0.78rem;
      color: var(--w-text-muted, #64748b);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-top: auto;
    }

    /* Skeleton Loading */
    .skeleton-box {
      background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%);
      background-size: 200% 100%;
      animation: pulse 1.5s infinite;
      border-radius: 4px;
    }
    @keyframes pulse {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
</head>
<body>

  <div id="widget-root" class="widget-container">
    <div class="widget-header">
      <h3 id="w-title" class="widget-title">Live News Feed</h3>
      <span class="widget-badge">● Live</span>
    </div>
    <div id="w-content" class="layout-news-wall">
      <!-- Cards rendered here -->
      <div class="widget-card shadow-soft" style="height:220px;">
        <div class="widget-card-media skeleton-box"></div>
        <div class="widget-card-body">
          <div class="skeleton-box" style="height:12px; width:40%; margin-bottom:8px;"></div>
          <div class="skeleton-box" style="height:16px; width:90%; margin-bottom:6px;"></div>
          <div class="skeleton-box" style="height:12px; width:70%;"></div>
        </div>
      </div>
      <div class="widget-card shadow-soft" style="height:220px;">
        <div class="widget-card-media skeleton-box"></div>
        <div class="widget-card-body">
          <div class="skeleton-box" style="height:12px; width:40%; margin-bottom:8px;"></div>
          <div class="skeleton-box" style="height:16px; width:90%; margin-bottom:6px;"></div>
          <div class="skeleton-box" style="height:12px; width:70%;"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="scripts/widget-font-catalog.js"></script>
  <script>
    (function () {
      'use strict';

      const params = new URLSearchParams(window.location.search);
      const feedUrl = params.get('feed') || params.get('url') || '';
      const title = params.get('title') || 'Live News Feed';
      const allowedLayouts = new Set(['news-wall', 'carousel', 'ticker', 'magazine', 'list', 'imageboard']);
      const allowedThemes = new Set(['light', 'dark', 'slate', 'glass', 'transparent']);
      const allowedShadows = new Set(['none', 'soft', 'raised', 'glow']);
      const layout = allowedLayouts.has(params.get('layout')) ? params.get('layout') : 'news-wall';
      const theme = allowedThemes.has(params.get('theme')) ? params.get('theme') : 'light';
      const accent = /^#[0-9a-f]{6}$/i.test(params.get('accent') || '') ? params.get('accent') : '#10b981';
      const radius = /^(0|8|12|20)px$/.test(params.get('radius') || '') ? params.get('radius') : '12px';
      // Accept only catalogue values, then load exactly the selected web font.
      const fontCatalog = window.FeedOmeterWidgetFonts;
      const font = fontCatalog ? fontCatalog.find(params.get('font')).value : "'Inter', sans-serif";
      if (fontCatalog) fontCatalog.load(font);
      const shadow = allowedShadows.has(params.get('shadow')) ? params.get('shadow') : 'soft';
      const clamp = ['1', '2', '3'].includes(params.get('clamp')) ? params.get('clamp') : '2';
      const showHeader = params.get('header') !== '0';
      const align = params.get('align') || 'left';
      const limit = Math.max(1, Math.min(20, parseInt(params.get('items') || '6', 10) || 6));
      const showThumbs = params.get('thumbs') !== '0';
      const showDesc = params.get('desc') !== '0';
      const showDate = params.get('date') !== '0';
      const linkTarget = params.get('target') === '_self' ? '_self' : '_blank';
      const tickerSpeed = params.get('speed') || '65s';

      // Apply styling
      const root = document.getElementById('widget-root');
      let bg = '#ffffff', cardBg = '#ffffff', border = '#e2e8f0', text = '#0f172a', textMuted = '#64748b';

      if (theme === 'dark') {
        bg = '#0f172a'; cardBg = '#1e293b'; border = '#334155'; text = '#f8fafc'; textMuted = '#94a3b8';
      } else if (theme === 'slate') {
        bg = '#f1f5f9'; cardBg = '#ffffff'; border = '#cbd5e1'; text = '#1e293b'; textMuted = '#64748b';
      } else if (theme === 'glass') {
        bg = 'rgba(255,255,255,0.7)'; cardBg = 'rgba(255,255,255,0.85)'; border = 'rgba(255,255,255,0.4)'; text = '#0f172a'; textMuted = '#475569';
      } else if (theme === 'transparent') {
        bg = 'transparent'; cardBg = 'transparent'; border = '#e2e8f0'; text = '#0f172a'; textMuted = '#64748b';
      }

      root.style.setProperty('--w-bg', bg);
      root.style.setProperty('--w-card-bg', cardBg);
      root.style.setProperty('--w-card-border', border);
      root.style.setProperty('--w-card-radius', radius);
      root.style.setProperty('--w-accent', accent);
      root.style.setProperty('--w-font', font);
      root.style.setProperty('--w-text', text);
      root.style.setProperty('--w-text-muted', textMuted);

      // Header configuration
      const headerEl = root.querySelector('.widget-header');
      if (!showHeader) {
        headerEl.style.display = 'none';
      } else {
        if (align === 'center') headerEl.classList.add('align-center');
        const titleEl = document.getElementById('w-title');
        if (titleEl) titleEl.textContent = title;
      }

      const contentEl = document.getElementById('w-content');
      contentEl.className = `layout-${layout}`;

      function decodeEntities(str) {
        if (!str) return '';
        const txt = document.createElement('textarea');
        txt.innerHTML = str;
        return txt.value;
      }

      function escapeHtml(value) {
        return String(value || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function safeArticleUrl(value) {
        try {
          const url = new URL(String(value || ''), window.location.href);
          return (url.protocol === 'https:' || url.protocol === 'http:') ? url.href : '#';
        } catch (_) { return '#'; }
      }

      function renderArticles(articles) {
        if (!articles || !articles.length) {
          contentEl.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:2rem; color:var(--w-text-muted);">No feed items found.</div>';
          notifyParentResize();
          return;
        }

        if (layout === 'ticker') {
          const buildTickerItemHtml = (art) => {
            let host = 'SOURCE';
            if (art.link) {
              try { host = new URL(art.link).hostname.replace(/^www\./i, ''); } catch (_) {}
            } else if (art.source) {
              host = typeof art.source === 'string' ? art.source : (art.source.title || 'SOURCE');
            }
            const cleanTitle = decodeEntities(art.title) || 'Breaking News Headline';
            const articleUrl = safeArticleUrl(art.link);
            return `
              <a class="ticker-item" href="${escapeHtml(articleUrl)}" target="${linkTarget}" rel="noopener noreferrer">
                <span class="ticker-source">${escapeHtml(host)}</span>
                <span class="ticker-title">${escapeHtml(cleanTitle)}</span>
                <span class="ticker-sep">●</span>
              </a>
            `;
          };

          const trackItems = articles.slice(0, 20).map(buildTickerItemHtml).join('');
          const duplicated = trackItems + trackItems;

          contentEl.innerHTML = `
            <div class="ticker-badge">
              <span>⚡ LIVE</span>
            </div>
            <div class="ticker-track-wrap">
              <div class="ticker-track">
                ${duplicated}
              </div>
            </div>
          `;

          const track = contentEl.querySelector('.ticker-track');
          if (track) {
            const num = parseInt(tickerSpeed, 10);
            const speedVal = isNaN(num) ? 20 : Math.max(0, Math.min(100, num));
            if (speedVal === 0) {
              track.style.animationPlayState = 'paused';
            } else {
              track.style.animationPlayState = 'running';
              const pxPerSec = Math.max(5, 5 + (speedVal * 0.9));
              const halfWidth = (track.scrollWidth / 2) || 4000;
              const durationSec = Math.max(8, (halfWidth / pxPerSec)).toFixed(1);
              track.style.animationDuration = durationSec + 's';
            }
          }

          notifyParentResize();
          return;
        }

        let html = '';
        articles.slice(0, limit).forEach(art => {
          const img = safeArticleUrl(art.image || art.image_url || art.thumbnail || art.ogImage || art.hero_image || (art.enclosure && art.enclosure.url) || '');
          let mediaHtml = '';
          if (showThumbs) {
            if (img !== '#') {
              mediaHtml = `
                <div class="widget-card-media">
                  <img src="${escapeHtml(img)}" alt="" loading="lazy" onerror="this.parentElement.innerHTML='<div class=\\'widget-card-placeholder\\'><span>📰</span></div>';" />
                </div>
              `;
            } else {
              mediaHtml = `
                <div class="widget-card-media">
                  <div class="widget-card-placeholder"><span>📰</span></div>
                </div>
              `;
            }
          }

          let host = 'SOURCE';
          if (art.link) {
            try { host = new URL(art.link).hostname.replace(/^www\./i, ''); } catch (_) {}
          } else if (art.source) {
            host = typeof art.source === 'string' ? art.source : (art.source.title || 'SOURCE');
          }

          const cleanTitle = decodeEntities(art.title) || 'Untitled Article';
          const cleanSnippet = decodeEntities(art.description || art.summary || art.snippet || '').replace(/<[^>]+>/g, '').trim().slice(0, 140);
          const articleUrl = safeArticleUrl(art.link);

          const metaHtml = showDate
            ? `<div class="widget-card-meta"><span class="widget-card-domain">${escapeHtml(host)}</span></div>`
            : '';
          const descHtml = (showDesc && cleanSnippet)
            ? `<p class="widget-card-desc">${escapeHtml(cleanSnippet)}...</p>`
            : '';

          html += `
            <a class="widget-card shadow-${shadow}" href="${escapeHtml(articleUrl)}" target="${linkTarget}" rel="noopener noreferrer" title="${escapeHtml(cleanTitle)}">
              ${mediaHtml}
              <div class="widget-card-body">
                ${metaHtml}
                <div class="widget-card-title clamp-${clamp}">${escapeHtml(cleanTitle)}</div>
                ${descHtml}
              </div>
            </a>
          `;
        });

        contentEl.innerHTML = html;
        notifyParentResize();
      }

      function notifyParentResize() {
        try {
          if (window.parent && window.parent !== window) {
            const h = document.documentElement.scrollHeight || document.body.scrollHeight;
            window.parent.postMessage({ type: 'feedometer:widget-resize', height: h }, '*');
          }
        } catch (_) {}
      }

      // API Data Fetching with Cloudflare Edge KV Cache
      const apiBase = (window.FEEDOMETER_API_BASE || '').replace(/\/+$/, '');
      const endpoint = feedUrl
        ? `${apiBase}/api/stream?urls=${encodeURIComponent(feedUrl)}&limit=${Math.max(limit, 15)}`
        : `${apiBase}/api/stream?limit=${Math.max(limit, 15)}`;

      fetch(endpoint)
        .then(res => res.json())
        .then(data => {
          const items = data.items || data.articles || [];
          renderArticles(items);
        })
        .catch(() => {
          renderArticles([]);
        });

      window.addEventListener('resize', notifyParentResize);
    })();
  </script>
</body>
</html>
